<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크린 · 네트워크 포럼 운영 프로그램</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@font-face{font-family:'GyeonggiTitle';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/GyeonggiTitle/GyeonggiTitle-Medium.woff2') format('woff2')}
@font-face{font-family:'GyeonggiTitle';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/GyeonggiTitle/GyeonggiTitle-Bold.woff2') format('woff2')}
/* 색은 DESIGN.md 토큰만 쓴다. 진행 상태(wait/draft/done)는 밝은 화면 토큰을 그대로 가져와 어두운 바탕 위의 카드로 쓴다 */
:root{--gg:#0E4194;--gg-l:#1B5AAE;--gg-d:#072448;--gg-green:#299738;--hc-teal:#00A496;--hc-lime:#ABCD03;--hc-orange:#F39800;--hc-deep:#ED6100;--hc-yellow:#EDC300;
  --teal-b:#4FD8C8;--lime-b:#CBE84F;--orange-b:#FFB43F;--yellow-b:#FFDE4D;--green-b:#57D07A;--txt:#F4F7FC;--mut:#A8BFE2;--mut-2:#7D97C2;
  --soft:#EEF2F8;--muted:#5F6979;--gold:#B86E00;--gold-bg:#FFF6E9;--ok:#00786E;--done-bg:#E0F5F2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--gg-d);color:var(--txt);font-family:"GyeonggiTitle","Malgun Gothic","맑은 고딕",system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
.screen{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(158deg,var(--gg-l) 0%,var(--gg) 44%,var(--gg-d) 100%);word-break:keep-all;overflow-wrap:anywhere}   /* 낱말 단위로만 줄바꿈 (v3.8) */
.brand{flex:none;background:#fff;display:flex;align-items:center;gap:clamp(12px,1.6vw,26px);padding:0 clamp(20px,2.6vw,52px);height:clamp(46px,7.4vh,92px)}
.brand img.gg{height:clamp(22px,3.6vh,44px);width:auto;display:block}
.brand img.hc{height:clamp(28px,4.6vh,56px);width:auto;display:block}
.brand .sp{flex:1}
.brand .ttl{color:var(--gg);font-size:clamp(13px,1.8vh,22px);font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.tri{flex:none;height:clamp(3px,.55vh,7px);display:flex}.tri i{flex:1}
.tri i:nth-child(1){background:var(--hc-teal)}.tri i:nth-child(2){background:var(--hc-lime)}.tri i:nth-child(3){background:var(--hc-orange)}
.s-head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:clamp(14px,2.4vh,30px) clamp(24px,3vw,48px) clamp(8px,1.4vh,16px);font-size:clamp(16px,2.2vh,24px)}   /* 화면 맨 위에 바로 (로고 띠는 맨 아래, v3.19) */
.s-head:empty{padding:clamp(8px,1.4vh,16px) 0 0}   /* 머리 글이 없는 장(등록 벽 · 발표자 · 마지막 장)은 여백만 조금 */
.s-head .chip{background:#fff;color:var(--gg);border-radius:.4em;padding:.28em .9em;font-weight:600;font-size:clamp(18px,2.8vh,34px);white-space:nowrap}
.s-head .ev{color:var(--mut)}
.s-head .hl{display:flex;align-items:center;gap:12px;min-width:0}
.s-body{flex:1;padding:clamp(8px,1.4vh,18px) clamp(26px,4vw,64px) clamp(30px,6.5vh,80px);display:flex;flex-direction:column;justify-content:center;position:relative;min-height:0}   /* 아래 여백을 크게: LED 아래쪽은 단상에 가려 글이 위쪽에 모이도록 (v3.19) */
.s-body.pos-top{justify-content:flex-start}.s-body.pos-middle{justify-content:center}.s-body.pos-bottom{justify-content:flex-end}
.s-foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:clamp(6px,1vh,12px) clamp(24px,3vw,48px);font-size:clamp(14px,2vh,18px);color:var(--mut)}   /* 어두운 띠 배경 없이 — 바로 아래 흰 로고 띠가 꼬리 (v3.19) */
.s-topic{display:inline-block;padding:5px 14px;border-radius:.4em;font-size:clamp(24px,3.4vh,38px);font-weight:700;margin-bottom:20px;align-self:flex-start}
.s-topic.t1{background:var(--hc-teal);color:var(--gg-d)}.s-topic.t2{background:var(--hc-lime);color:var(--gg-d)}.s-topic.t3{background:var(--hc-orange);color:var(--gg-d)}.s-topic.t4{background:var(--hc-deep);color:#fff}
.s-topic.pre{background:rgba(255,255,255,.14);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(12px,2vh,20px)}.chips .s-topic{margin:0}
.s-one{font-size:clamp(34px,min(5vw,6.2vh),66px);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0 0 clamp(14px,2.4vh,30px);color:var(--orange-b);text-wrap:balance}
.s-one::before{content:"“";color:#fff;margin-right:6px}.s-one::after{content:"”";color:#fff;margin-left:6px}
.s-points{margin:0 0 clamp(14px,2.2vh,28px);padding-left:1.4em;font-size:clamp(22px,min(2.8vw,3.4vh),36px);line-height:1.45}
.s-points li{margin-bottom:.25em}.s-points li::marker{color:var(--teal-b);font-weight:700}
.s-note{font-size:clamp(22px,min(2.8vw,3.4vh),36px);line-height:1.5;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:hidden}   /* v3.19: 본문이 짧아져 50vh */
.s-cols{display:grid;grid-template-columns:1fr 1fr;gap:36px}
/* 테이블 정리 장: 한 문장 · 핵심(최대 6) · 경기도에 바라는 것. 글이 많으면 --fit 으로 줄여 한 장에 (v3.9.3) */
.tbl-fit{--fit:1;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.tbl-fit .s-one{font-size:calc(clamp(34px,min(5vw,6.2vh),66px) * var(--fit))}
.tbl-fit .s-points{font-size:calc(clamp(22px,min(2.8vw,3.4vh),36px) * var(--fit))}
.s-wish{border-top:1px solid rgba(255,255,255,.2);padding-top:clamp(10px,1.6vh,20px)}
.s-wish b{display:block;color:var(--teal-b);font-size:calc(clamp(20px,2.8vh,30px) * var(--fit,1));letter-spacing:.06em;margin-bottom:6px}
.s-wish p{margin:0;font-size:calc(clamp(22px,min(2.8vw,3.4vh),36px) * var(--fit,1));line-height:1.45}
/* 테이블 결과 장표: 왼쪽 한 문장·핵심·바라는 것 / 오른쪽 「자주 나온 말」 칩 (v3.10.3) */
.tbl-wrap{flex:1;min-height:0;display:flex;gap:clamp(24px,3vw,56px);align-items:stretch}
.tbl-wrap .tbl-fit{flex:1;min-width:0}
.tbl-kw{flex:none;width:clamp(250px,24%,420px);display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2vh,22px);padding:clamp(16px,2.4vh,30px) clamp(16px,1.6vw,28px);border-radius:18px;background:rgba(255,255,255,.07);border-left:6px solid var(--teal-b);overflow:hidden}
.tbl-kw b{color:var(--teal-b);font-size:clamp(22px,3vh,32px);letter-spacing:.06em}
.tbl-kw .kw-chips{display:flex;flex-wrap:wrap;gap:clamp(10px,1.6vh,18px)}
.tbl-kw .kw-chips span{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:.22em .7em;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.38);color:#fff;font-size:clamp(24px,3.4vh,36px);font-weight:600;line-height:1.3}
.tbl-kw .kw-chips span.k1{font-size:clamp(30px,4.4vh,46px);border-color:transparent;color:var(--gg-d);background:var(--hc-teal)}
.tbl-kw .kw-chips span.k2{font-size:clamp(27px,3.8vh,40px);background:rgba(255,255,255,.2)}
.tbl-kw.t1{border-color:var(--hc-teal)}.tbl-kw.t1 b{color:var(--hc-teal)}.tbl-kw.t1 .kw-chips span.k1{background:var(--hc-teal)}
.tbl-kw.t2{border-color:var(--hc-lime)}.tbl-kw.t2 b{color:var(--hc-lime)}.tbl-kw.t2 .kw-chips span.k1{background:var(--hc-lime)}
.tbl-kw.t3{border-color:var(--hc-orange)}.tbl-kw.t3 b{color:var(--hc-orange)}.tbl-kw.t3 .kw-chips span.k1{background:var(--hc-orange)}
.tbl-kw.t4{border-color:var(--hc-deep)}.tbl-kw.t4 b{color:#fff}.tbl-kw.t4 .kw-chips span.k1{background:var(--hc-deep);color:#fff}   /* 첫 칩은 주제 색 (선택자 우선순위를 기본 .k1 보다 높게) */
.s-cols b{display:block;color:var(--teal-b);font-size:clamp(22px,3vh,32px);letter-spacing:.06em;margin-bottom:8px}
.s-cols p{margin:0;font-size:clamp(22px,min(2.8vw,3.4vh),36px);line-height:1.45}
.s-same{position:absolute;inset:0;background:rgba(7,36,72,.86);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.s-same b{font-size:clamp(40px,7vw,84px);color:var(--yellow-b);border:4px solid var(--yellow-b);border-radius:14px;padding:10px 44px}
.s-same span{font-size:clamp(22px,3vh,30px);color:var(--mut)}
.s-big{font-size:clamp(70px,13vw,170px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-align:center;color:#fff}
.s-big.over{color:var(--orange-b)}
.s-center{text-align:center}
.s-title{font-size:clamp(40px,5.4vw,68px);font-weight:700;letter-spacing:-.03em;color:var(--orange-b);text-align:center;text-wrap:balance}
.s-sub{font-size:clamp(22px,3vh,30px);color:var(--mut);text-align:center}
.sec-t{flex:none;font-size:clamp(34px,4.8vh,58px);font-weight:700;color:var(--orange-b);letter-spacing:-.02em;line-height:1.2}
.sec-s{flex:none;font-size:clamp(18px,2.6vh,28px);color:var(--mut);margin:.2em 0 clamp(12px,2vh,24px)}
.lead{flex:none;font-size:clamp(30px,4.6vh,54px);font-weight:700;color:var(--orange-b);letter-spacing:-.02em;margin-bottom:clamp(10px,1.6vh,20px)}
.s-list{font-size:clamp(28px,4vh,40px);line-height:1.5;margin:0;padding-left:1.2em}
.s-list li b{color:var(--orange-b)}
.s-list.two{columns:2;column-gap:clamp(24px,3vw,56px);font-size:clamp(24px,3.4vh,34px);line-height:1.45}   /* 건의가 7건 넘으면 두 단으로 */
.s-list.two li{break-inside:avoid}
.s-chips span{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 14px;font-size:clamp(22px,2.8vh,30px);margin:4px 6px 4px 0}
.s-timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:clamp(12px,2.2vh,22px)}
.s-timeline div{background:rgba(255,255,255,.08);border-radius:8px;padding:clamp(8px,1.4vh,12px);text-align:center;font-size:clamp(16px,2.4vh,22px)}
.s-timeline div.on{background:var(--hc-teal);color:var(--gg-d)}
.s-timeline div b{display:block;font-size:clamp(22px,3.4vh,30px)}
.empty{color:var(--mut-2);font-size:clamp(22px,3vh,30px);text-align:center;padding:40px}
/* 「포럼의 키워드」 (v3.11): 제목 아래 낱말들이 불규칙하게 흩어져 화면을 채운다 */
.cloud{flex:1;min-height:0;display:flex;flex-direction:column}
.cl-title{text-align:center;font-size:clamp(40px,6.4vh,74px);font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.15}
.cl-sub{text-align:center;color:var(--mut);font-size:clamp(18px,2.6vh,28px);margin-top:.35em}
.cl-area{flex:1;min-height:0;position:relative;margin-top:clamp(8px,1.6vh,20px)}
.cl-area .cw{position:absolute;white-space:nowrap;font-weight:700;line-height:1;padding:.06em .1em;text-shadow:0 3px 14px rgba(0,0,0,.28);animation:cwin .7s ease-out both;transform-origin:center}
.cl-area .cw.line{font-weight:500;opacity:.9}
.cloud.v-c .cw{padding:.22em .6em;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);text-shadow:none}
.cloud.v-c .cw.group{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5)}
@keyframes cwin{from{opacity:0}to{opacity:1}}
.s-body.cloud-slide{padding-top:clamp(8px,1.4vh,16px);padding-bottom:clamp(30px,6.5vh,80px)}   /* v3.19.1: 키워드도 아래 여백 확보(단상에 가리는 영역) */
.cloud.f-area .cl-area{border:2px solid rgba(255,255,255,.35);border-radius:28px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 60px rgba(0,0,0,.12)}   /* 구름 전체 틀 */
.cloud.f-word .cw{border:2px solid currentColor;border-radius:.32em;padding:.1em .38em;text-shadow:none}.cloud.f-word .cw.group{border-width:3px}   /* 낱말마다 제 색 테두리 */
/* 간지(1부·2부·마무리·폐회) */
.div{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(10px,2vh,24px)}
.div,.gone,.spk{padding-bottom:clamp(44px,11vh,130px)}   /* 가운데 정렬 장(간지 · 인사말 · 발표자)은 글을 더 위로 — LED 아래쪽이 단상에 가림 (v3.19) */
.div .k{font-size:clamp(20px,3vh,36px);color:var(--teal-b);letter-spacing:.1em;font-weight:700}
.div .t{font-size:clamp(48px,6.4vw,108px);font-weight:700;letter-spacing:-.03em;line-height:1.15;color:#fff;text-wrap:balance}
.div .s{font-size:clamp(26px,3.6vh,44px);color:var(--orange-b);font-weight:700}
.div .m{font-size:clamp(20px,2.6vh,30px);color:var(--mut);line-height:1.5}
.div .m.big{font-size:clamp(24px,3.2vh,38px);color:var(--txt)}
/* 발표자 한 장 */
.spk{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.spk-t{font-size:calc(clamp(48px,6.4vw,108px) * var(--fit,1));font-weight:700;line-height:1.2;letter-spacing:-.03em;color:var(--orange-b);white-space:nowrap;max-width:100%;margin:0 0 clamp(18px,3vh,40px)}   /* 한 줄: 길면 글자를 줄인다(fitOneLine, v3.8) */
.spk-t::before{content:"“";color:#fff;margin-right:.1em}.spk-t::after{content:"”";color:#fff;margin-left:.1em}
.spk-n{font-size:clamp(44px,6.4vh,84px);font-weight:700;color:#fff}
.spk-n .none{color:var(--mut-2);font-weight:400;font-size:.6em}
/* 다과 안내 (1부 · 1라운드 좌석 안내 다음 장, v3.15) — 왼쪽 글, 오른쪽 찻잔·다과(송편·쿠키·케이크) 그림 */
.s-body.brkb-body{overflow:hidden;padding-top:clamp(6px,1vh,14px);padding-bottom:clamp(20px,4vh,50px)}   /* v3.19.1 */
.brkb-bg{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 31% 44% at 75% 54%,rgba(255,206,92,.40),rgba(255,180,63,.16) 52%,rgba(255,180,63,0) 100%),radial-gradient(ellipse 28% 40% at 20% 58%,rgba(203,232,79,.08),rgba(203,232,79,0) 100%)}   /* 잔 뒤 따뜻한 불빛 */
.brkb{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:clamp(10px,2vw,40px)}
.brkb-tx{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,2.8vh,36px);padding-left:clamp(0px,.6vw,12px)}
.brkb-t{font-size:calc(clamp(64px,7.4vw,134px) * var(--fit,1));font-weight:700;letter-spacing:-.035em;line-height:1.14;color:#fff;white-space:nowrap;max-width:100%;text-shadow:0 .06em .22em rgba(4,22,56,.28);margin-bottom:.06em}
.brkb-u{position:relative;display:inline-block;z-index:0}
.brkb-ul{position:absolute;left:0;bottom:-.1em;width:100%;height:.3em;z-index:-1;overflow:visible}
.brkb-ul path{stroke:var(--yellow-b);stroke-width:.11em;stroke-linecap:round;vector-effect:non-scaling-stroke}
.brkb-s{margin:0;font-size:clamp(36px,5.4vh,66px);font-weight:700;line-height:1.36;letter-spacing:-.015em;color:#fff}
.brkb-s b{color:var(--yellow-b)}
.brkb-m{margin:0;font-size:clamp(32px,4.7vh,56px);font-weight:700;line-height:1.4;letter-spacing:-.015em;color:var(--lime-b)}
.brkb-art{position:relative;align-self:stretch;min-height:0}
.brkb-hero{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.brkb-steam path{transform-box:fill-box;transform-origin:50% 100%;animation:brkb-steam 6s ease-in-out infinite}
.brkb-steam .st1{animation-delay:calc(var(--t0,0s) - 0s)}.brkb-steam .st2{animation-delay:calc(var(--t0,0s) - 2s)}.brkb-steam .st3{animation-delay:calc(var(--t0,0s) - 4s)}
@keyframes brkb-steam{0%,100%{transform:translateY(0) scaleY(1);opacity:.75}50%{transform:translateY(-3%) scaleY(1.07);opacity:1}}
@media (prefers-reduced-motion: reduce){.brkb-steam path{animation:none}}
/* 기념촬영 — 사진 배경이므로 글자만 */
.photo-t{flex:none;font-size:calc(clamp(52px,7vw,116px) * var(--fit,1));font-weight:700;letter-spacing:-.03em;color:#fff;text-align:center;line-height:1.15;white-space:nowrap;max-width:100%;align-self:center}   /* 한 줄 (v3.8) */
.photo-s{flex:none;font-size:clamp(28px,3.4vw,50px);font-weight:700;text-align:center;margin-top:.4em;letter-spacing:-.01em}
.photo-s span{display:inline-block;background:linear-gradient(90deg,var(--lime-b) 0%,var(--green-b) 50%,var(--teal-b) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .1em}   /* 「경기 중장년, 경험을 잇고 내일을 묻다」 슬로건 색 (v3.8) */
/* 인사말·축사 — 한 장에 한 명: 위에 소속(크게), 아래에 이름(더 크게). 인사말은 청록, 축사는 주황 계열로 구분 */
.gone{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(14px,2.8vh,40px);--ac:var(--teal-b)}
.gone.cong{--ac:var(--orange-b)}
.gone .gk{font-size:clamp(26px,4.2vh,54px);font-weight:700;letter-spacing:.14em;color:var(--ac);border:2px solid var(--ac);border-radius:.4em;padding:.15em .9em}
.gone .go{font-size:clamp(46px,7.6vh,112px);font-weight:700;color:#fff;line-height:1.25;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all;max-width:92%}
.gone .gn{font-size:clamp(104px,21vh,280px);font-weight:700;line-height:1.1;letter-spacing:-.03em;color:var(--ac)}
.gone .gn .none{color:var(--mut-2);font-weight:400;font-size:.45em}
.gone .go.none{color:var(--mut-2);font-weight:400}
/* 영상 */
.vid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px)}
.vid .s-title{flex:none}
.vwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.vbox{position:relative;background:var(--gg-d);border-radius:8px;overflow:hidden;width:100%;height:100%}
.vbox iframe,.vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--gg-d)}
.vhint{flex:none;font-size:clamp(12px,1.6vh,16px);color:var(--mut-2)}
.vbox video{object-fit:contain}
/* 시네마(v3.18): 오프닝 영상 장은 로고 띠 · 머리 · 꼬리 · 제목 없이 영상만 화면 가득. 16:9 가 아닌 화면에서는 검은 띠 */
.screen.cinema .brand,.screen.cinema .tri,.screen.cinema .s-head,.screen.cinema .s-foot,.screen.cinema .vid .s-title{display:none}
.screen.cinema .s-body{padding:0;background:#000}
.screen.cinema .vid{gap:0}
.screen.cinema .vbox{border-radius:0;background:#000}
.screen.cinema .vbox video{background:#000}
.vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(20px,3vh,36px);background:rgba(7,36,72,.35);cursor:pointer}
/* 토론 주제 4개 */
.tp4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(10px,1.4vw,22px)}
/* 토론 주제 카드: 꼬리표(주제 N · 영역) → 제목(크게) → 부제 → 테이블 번호. 설명(긴 질문)은 v3.9.5 에서 삭제. 넘치면 --fit 으로 축소 */
.tpc{--fit:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:clamp(8px,1.6vh,20px);min-height:0;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.08);border-top:clamp(6px,1vh,12px) solid var(--rc);padding:clamp(14px,2.4vh,36px) clamp(18px,2.2vw,44px)}
.tpc .k{font-size:calc(clamp(18px,2.7vh,32px) * var(--fit));font-weight:700;letter-spacing:.02em;background:var(--rc);color:var(--gg-d);border-radius:.35em;padding:.1em .65em;line-height:1.35}
.tpc.t4 .k{color:#fff}
.tpc h3{margin:0;font-size:calc(clamp(32px,5.8vh,68px) * var(--fit));line-height:1.2;letter-spacing:-.025em;color:#fff;text-wrap:balance}
.tpc .sub{font-size:calc(clamp(22px,3.5vh,42px) * var(--fit));line-height:1.35;color:#D7E3F7;text-wrap:balance}
.tpc .nw{white-space:nowrap}
.tpc .tb{flex:none;margin-top:clamp(2px,.6vh,10px);font-size:calc(clamp(17px,2.4vh,28px) * var(--fit));color:var(--rc-b);font-weight:700}
/* 주제 색: --rc 는 원색(띠·바탕), --rc-b 는 어두운 바탕 위 글자용 밝은 변형 */
.t1{--rc:var(--hc-teal);--rc-b:var(--teal-b)}.t2{--rc:var(--hc-lime);--rc-b:var(--lime-b)}.t3{--rc:var(--hc-orange);--rc-b:var(--orange-b)}.t4{--rc:var(--hc-deep);--rc-b:var(--orange-b)}
/* 9칸 격자(지도·명단·현황) */
.g9{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(8px,1.2vw,18px)}
.c9{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-left:clamp(5px,.7vh,10px) solid var(--rc);padding:clamp(8px,1.3vh,18px) clamp(10px,1.2vw,22px)}
.c9 .ch{flex:none;display:flex;align-items:baseline;gap:.5em;margin-bottom:clamp(5px,.9vh,12px);padding-bottom:clamp(4px,.7vh,10px);border-bottom:1px solid rgba(255,255,255,.2);white-space:nowrap;overflow:hidden}
.c9 .no{font-size:clamp(26px,4vh,52px);font-weight:700;color:var(--rc-b);line-height:1;font-variant-numeric:tabular-nums}
.c9 .hall{font-size:clamp(16px,2.2vh,26px);color:#fff;font-weight:600}
.c9 .tp{margin-left:auto;font-size:clamp(18px,2.4vh,26px);color:var(--mut-2);overflow:hidden;text-overflow:ellipsis}
.names{flex:1;min-height:0;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.1em .75em;font-size:calc(clamp(18px,3vh,38px) * var(--fit,1));font-weight:600;color:#fff;line-height:1.4;word-break:keep-all}
.names.none{color:var(--mut-2);font-weight:400;font-size:clamp(16px,2.4vh,26px)}
/* 칸 = 왼쪽(번호 · 상태 · 홀) | 오른쪽(주제 꼬리표 · 주제명). 칸 전체 색이 상태: 대기 흰색 · 작성 중 노란색 · 작성 완료 = 주제 색으로 가득 (v3.9.2) */
.sc{--fit:1;--ink:var(--gg-d);display:grid;grid-template-columns:minmax(0,25%) minmax(0,1fr);min-height:0;overflow:hidden;border-radius:10px;border-top:clamp(6px,1vh,12px) solid var(--rc);background:#FFFFFF;color:var(--ink);transition:background .35s,border-color .35s,color .35s}
.sc.draft{background:#FFD84D}
.sc.done{background:var(--rc)}
.sc .side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;padding:clamp(6px,1vh,14px) clamp(6px,.6vw,12px);border-right:2px solid rgba(7,36,72,.12);background:rgba(7,36,72,.05)}
.sc .no{font-size:calc(clamp(40px,7.8vh,104px) * var(--fit));font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sc .lb{font-size:calc(clamp(15px,2.4vh,30px) * var(--fit));font-weight:700;white-space:nowrap;padding:.08em .55em;border-radius:.35em}
.sc.wait .lb{color:#5F6979;background:#EEF2F8}
.sc.draft .lb{color:#5C3D00;background:rgba(255,255,255,.6)}
.sc.done .lb{color:#fff;background:var(--gg-d)}
.sc .main{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:.45em;padding:clamp(8px,1.3vh,18px) clamp(12px,1.3vw,24px);text-align:left}
.sc .cat{font-size:calc(clamp(15px,2.2vh,26px) * var(--fit));font-weight:700;line-height:1.3;background:var(--rc);color:var(--gg-d);border-radius:.35em;padding:.1em .6em}
.sc.t4 .cat{color:#fff}
.sc.done .cat{background:rgba(7,36,72,.85);color:#fff}   /* 칸이 주제 색이 되면 꼬리표는 남색으로 */
.sc .tt{font-size:calc(clamp(22px,3.7vh,48px) * var(--fit));font-weight:700;line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
.sc .ln{font-size:calc(clamp(12px,1.7vh,20px) * var(--fit));color:rgba(7,36,72,.68);white-space:nowrap;margin-top:.2em}
.sc .nw{white-space:nowrap}
.lg{font-style:normal;display:inline-block;margin-left:8px;padding:1px 10px;border-radius:.4em;font-size:clamp(18px,2.4vh,26px);font-weight:700;border:1px solid transparent}
.sc.fresh{outline:6px solid #fff;outline-offset:-6px;box-shadow:0 0 0 4px var(--yellow-b),0 0 28px rgba(255,222,77,.7)}   /* 방금 작성 완료된 테이블: 6초 동안 흰 테두리 + 노란 빛 */
.sc.new{animation:donepop 1.2s ease-out}   /* 그중 처음 1.3초만 한 번 튀어오름 */
@keyframes donepop{0%{transform:scale(.92);box-shadow:0 0 0 0 rgba(255,222,77,.9)}60%{transform:scale(1.03);box-shadow:0 0 0 14px rgba(255,222,77,0)}100%{transform:none;box-shadow:none}}
.lg.wait{background:#FFFFFF;color:var(--gg-d)}.lg.draft{background:#FFD84D;color:var(--gg-d)}.lg.done{background:linear-gradient(90deg,var(--hc-teal),var(--hc-lime) 50%,var(--hc-orange));color:var(--gg-d)}   /* 범례: 흰색 · 노란색 · 주제 색 */
/* 패널 제목 줄 */
.pt{flex:none;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin-bottom:clamp(8px,1.4vh,16px)}
.pt b{font-size:clamp(26px,3.8vh,44px);color:var(--orange-b);letter-spacing:-.02em}
.pt span{font-size:clamp(18px,2.4vh,28px);color:var(--mut)}
.pt em{font-style:normal;color:#fff}
/* 숫자 타일(경기도 중장년, 지금) */
.fgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(8px,1.2vw,22px)}
.fcell:last-child:nth-child(4n+3){grid-column:span 2}   /* 7개면 마지막 칸이 비지 않게 두 칸 차지 */
.fcell{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;overflow:hidden;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);padding:clamp(6px,1.2vh,18px)}
.fcell .fv{font-size:clamp(28px,6vh,84px);font-weight:700;line-height:1.05;letter-spacing:-.03em;color:var(--orange-b);white-space:nowrap;font-variant-numeric:tabular-nums}
.fcell .fk{font-size:clamp(20px,3.2vh,36px);font-weight:600;color:#fff;margin-top:.4em;word-break:keep-all;line-height:1.3}
.fcell .fs{font-size:clamp(17px,2.5vh,28px);color:var(--mut);margin-top:.25em;word-break:keep-all;line-height:1.35}
.fgrid.compact .fv{font-size:clamp(24px,4.6vh,62px)}
.fgrid.compact .fk{font-size:clamp(14px,2vh,26px)}
.ffoot{flex:none;margin-top:clamp(8px,1.4vh,16px);font-size:clamp(18px,2.4vh,28px);color:var(--mut);text-align:center}
/* 트렌드 카드(라운드 패널 · 휴식 화면) — 팩트만: 머리글(크게) · 번호 배지 · 키워드 · 설명 (· 한 줄 더). 가운데 정렬, 카드마다 강조색 (v3.8) */
.trend{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(12px,2.4vh,32px);animation:fadein .3s ease-out}
.trend .tk{flex:none;display:flex;align-items:baseline;gap:.5em;font-weight:700}
.trend .tk b{font-size:clamp(34px,5.2vh,66px);color:#fff;letter-spacing:-.02em}
.trend .tk span{font-size:clamp(20px,2.8vh,34px);color:var(--orange-b);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tgrid{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2vw,40px);align-items:stretch}
.tgrid.one{grid-template-columns:minmax(0,1fr);max-width:min(1100px,62%);margin:0 auto}
.tcard{--ac:var(--orange-b);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(10px,2vh,28px);min-height:0;overflow:hidden;text-align:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-top:clamp(6px,1.1vh,14px) solid var(--ac);border-radius:18px;padding:clamp(18px,3.4vh,48px) clamp(22px,2.6vw,52px);box-shadow:0 12px 40px rgba(0,0,0,.22)}
.tcard.a2{--ac:var(--teal-b)}.tcard.a3{--ac:var(--lime-b)}.tcard.a4{--ac:var(--yellow-b)}
.tcard .tn{flex:none;font-size:calc(clamp(18px,2.6vh,30px) * var(--fit,1));font-weight:700;color:var(--ac);letter-spacing:.14em;font-variant-numeric:tabular-nums;border:2px solid var(--ac);border-radius:999px;padding:.1em .75em .1em .9em;line-height:1.3}
.tcard .tw{font-size:calc(clamp(46px,7.4vh,100px) * var(--fit,1));font-weight:700;color:var(--ac);line-height:1.1;letter-spacing:-.03em;text-wrap:balance}
.tcard .ts{font-size:calc(clamp(26px,3.8vh,46px) * var(--fit,1));line-height:1.5;color:#fff;max-width:92%;text-wrap:pretty}
.tcard .tm{font-size:calc(clamp(20px,2.6vh,32px) * var(--fit,1));color:var(--mut);max-width:92%}
.lv-panel .trend{animation:none}   /* 라운드 패널은 패널 자체가 페이드되므로 카드 페이드는 휴식 화면에서만 */
.trend.compact{gap:clamp(8px,1.4vh,18px)}
.trend.compact .tk b{font-size:clamp(24px,3.4vh,42px)}
.trend.compact .tk span{font-size:clamp(16px,2.2vh,26px)}
.trend.compact .tcard{gap:clamp(8px,1.4vh,18px);padding:clamp(14px,2.4vh,32px) clamp(18px,2vw,40px)}
.trend.compact .tcard .tn{font-size:calc(clamp(14px,2vh,22px) * var(--fit,1))}
.trend.compact .tcard .tw{font-size:calc(clamp(36px,5.6vh,76px) * var(--fit,1))}
.trend.compact .tcard .ts{font-size:calc(clamp(20px,3vh,36px) * var(--fit,1))}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* 취합 화면 머리 */
.col-lower{flex:1;min-height:0;display:flex;flex-direction:column}   /* 휴식 화면 아래쪽(수치 표 ↔ 카드)만 바꿔 그린다 */
.col-top{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(14px,2vw,36px);align-items:center;margin-bottom:clamp(8px,1.4vh,16px)}
.col-top .sec-t{font-size:clamp(30px,4.2vh,50px)}
.col-top .s-timeline{margin:0;grid-template-columns:repeat(3,minmax(0,1fr));width:clamp(280px,32vw,520px)}
/* 커뮤니티 롤링 띠 */
.ticker{flex:none;overflow:hidden;white-space:nowrap;background:rgba(255,255,255,.08);border-radius:8px;padding:clamp(6px,1vh,10px) 0;margin-top:clamp(8px,1.4vh,16px)}
.ticker .tk{display:inline-block;padding-left:20%;animation:tick var(--dur,30s) linear infinite;font-size:clamp(20px,2.6vh,28px);color:#fff}
.ticker .tk span{margin-right:3em}
.ticker .tk .lb{color:var(--teal-b);font-weight:700}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
/* 라운드 진행 화면 */
.lv-time{display:flex;align-items:center;gap:clamp(10px,1.2vw,22px);flex:none}
.lv-time b{font-size:clamp(44px,7vh,88px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:#fff;letter-spacing:-.02em}
.lv-time b.over{color:var(--orange-b)}.lv-time b.idle{color:var(--mut-2)}
.lv-panel{flex:1;min-height:0;display:flex;flex-direction:column;opacity:1;transition:opacity .15s ease}
/* 오늘의 한줄 벽 */
/* 맨 위 행사 제목 + 슬로건 (v3.9.4) */
.wall-hero{flex:none;text-align:center;margin-bottom:clamp(14px,2.6vh,34px)}
.wall-hero .wh-t{font-size:calc(clamp(40px,6.4vh,80px) * var(--fit,1));font-weight:700;color:#fff;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;max-width:100%;margin:0 auto}
.wall-hero .wh-s{margin-top:.25em;font-size:clamp(22px,3.4vh,42px);font-weight:700;letter-spacing:-.01em}
.wall-hero .wh-s span{display:inline-block;background:linear-gradient(90deg,var(--lime-b) 0%,var(--green-b) 50%,var(--teal-b) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .1em}
.wall{flex:1;min-height:0;display:grid;grid-template-columns:clamp(260px,24vw,320px) minmax(0,1fr);gap:clamp(24px,3vw,44px);align-items:stretch}
.wall-left{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.4vh,14px);min-height:0}
.wall-left h1{font-size:clamp(26px,4.2vh,36px);line-height:1.3;margin:0;color:var(--orange-b);letter-spacing:-.02em}
.wall-left .guide{font-size:clamp(22px,3.2vh,32px);color:#fff;font-weight:700;margin:0}
.wall-left p{margin:0;font-size:clamp(18px,2.6vh,26px);color:var(--mut)}
.qrbox{background:#fff;padding:12px;border-radius:12px;width:fit-content}
.qrbox small{display:block;text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.cnt{font-size:clamp(44px,7vh,64px);font-weight:700;line-height:1;color:#fff}
.cnt small{font-size:clamp(18px,2.4vh,24px);font-weight:400;color:var(--mut);margin-left:6px}
.goal{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}
.goal i{display:block;height:100%;background:var(--teal-b);width:0;transition:width .6s}
.goal-txt{font-size:clamp(18px,2.4vh,22px);color:var(--mut)}
.wall-right{display:flex;flex-direction:column;gap:14px;min-height:0}
.latest{background:rgba(255,255,255,.08);border-left:6px solid var(--orange-b);border-radius:8px;padding:16px 22px;min-height:100px}
.latest small{display:block;color:var(--orange-b);font-size:clamp(16px,2.2vh,22px);margin-bottom:4px;letter-spacing:.06em}
.latest div{font-size:clamp(28px,3.2vw,42px);font-weight:700;line-height:1.35;color:#fff;overflow-wrap:anywhere;word-break:break-word}
.latest.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:rgba(255,180,63,.45);transform:scale(1.01)}100%{background:rgba(255,255,255,.08);transform:none}}
.alldone{background:var(--hc-teal);color:var(--gg-d);border-radius:10px;padding:16px 24px;display:flex;align-items:center;gap:20px;animation:pop .6s ease-out}
.alldone b{font-size:clamp(28px,3.2vw,42px);white-space:nowrap}
.alldone span{font-size:clamp(18px,2vw,26px);line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:12px;flex:1;min-height:0;overflow:hidden;align-content:start}
.grid div{background:rgba(255,255,255,.08);border-radius:8px;padding:14px 16px;font-size:25px;line-height:1.35;overflow:hidden}
.grid div.new{background:rgba(255,180,63,.22);animation:pop .5s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 흐르는 벽: 위아래를 살짝 흐리게 하고, 트랙이 일정한 속도로 위로 이동 */
.flowwrap{flex:1;min-height:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 48px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 48px),transparent 100%)}
.track{position:relative;display:grid;grid-template-columns:1fr;gap:10px;align-content:start;will-change:transform}
.track div{background:rgba(255,255,255,.08);border-left:5px solid rgba(255,255,255,.18);border-radius:8px;padding:12px 20px;font-size:clamp(26px,2.8vw,36px);line-height:1.4;transition:background 1.5s,border-color 1.5s;overflow-wrap:anywhere;word-break:break-word}
.track div.new{background:rgba(255,180,63,.22);border-left-color:var(--orange-b)}
.wpage{display:flex;justify-content:flex-end;font-size:clamp(16px,2.2vh,22px);color:var(--mut-2)}
/* 오늘의 한줄 요약 슬라이드 — 같은 뜻끼리 묶은 비율(도넛·막대) */
.sum{display:grid;grid-template-columns:clamp(300px,34%,420px) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:clamp(12px,2vh,24px) clamp(24px,3vw,48px);align-items:stretch;flex:1;min-height:0;overflow:hidden}   /* stretch: 두 칸이 행 높이 안에 갇힘(start 면 넘쳐 마무리 문장과 겹침) · 넘치면 fitBoxes 가 --fit 으로 줄인다 (v3.10) */
.sum-left{--fit:1;display:flex;flex-direction:column;align-items:center;gap:calc(clamp(8px,1.6vh,14px) * var(--fit));min-height:0;overflow:hidden}
.donut{position:relative;width:calc(clamp(180px,min(24vw,30vh),320px) * var(--fit,1));flex:none;aspect-ratio:1;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.donut::after{content:"";position:absolute;inset:24%;border-radius:50%;background:var(--gg)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut .c b{font-size:calc(clamp(44px,5.4vw,76px) * var(--fit,1));font-weight:700;line-height:1;color:#fff}
.donut .c span{font-size:calc(clamp(15px,2vh,20px) * var(--fit,1));color:var(--mut);margin-top:4px}
.sum-kpi{display:flex;gap:22px;justify-content:center}
.sum-kpi div{text-align:center}.sum-kpi b{display:block;font-size:calc(clamp(30px,4vh,40px) * var(--fit,1));color:#fff;line-height:1.1}.sum-kpi span{font-size:calc(clamp(16px,2.2vh,22px) * var(--fit,1));color:var(--mut)}
.kwbars{width:100%;font-size:calc(clamp(16px,2.2vh,22px) * var(--fit,1))}
.kwbars div{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;margin-bottom:5px;color:var(--mut)}
.kwbars i{display:block;height:9px;border-radius:5px;background:rgba(255,255,255,.35)}
.kwbars b{color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.groups{--fit:1;display:flex;flex-direction:column;gap:calc(clamp(8px,1.3vh,14px) * var(--fit));min-height:0;overflow:hidden}
/* 낮은 화면(768px)에서는 묶음의 대표 글 줄을 접어 한 장에 담는다 */
.grp{background:rgba(255,255,255,.07);border-radius:10px;padding:calc(clamp(8px,1.2vh,14px) * var(--fit,1)) 18px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.grp .nm{display:flex;align-items:center;gap:10px;font-size:calc(clamp(20px,2.2vw,28px) * var(--fit,1));font-weight:700;color:#fff}
.grp .nm i{width:14px;height:14px;border-radius:4px;flex:none}
.grp .pct{font-size:calc(clamp(28px,3.2vw,44px) * var(--fit,1));font-weight:700;line-height:1;text-align:right}
.grp .pct small{font-size:calc(clamp(14px,2vh,17px) * var(--fit,1));color:var(--mut);margin-left:6px;font-weight:400}
.grp .bar{grid-column:1/-1;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.grp .bar i{display:block;height:100%;border-radius:5px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.grp .ex{grid-column:1/-1;font-size:calc(clamp(18px,1.9vw,25px) * var(--fit,1));color:var(--mut);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .ex b{color:var(--txt);font-weight:500}
@media (max-height:820px){.grp .ex{display:none}.grp{padding:calc(clamp(6px,1vh,10px) * var(--fit,1)) 16px}.kwbars div{margin-bottom:3px}}   /* .grp 규칙 뒤에 두어야 패딩 규칙이 산다 (v3.10) */
.sum-say{grid-column:1/-1;background:rgba(255,255,255,.08);border-left:6px solid var(--orange-b);border-radius:8px;padding:12px 20px;font-size:clamp(26px,min(2.8vw,4vh),36px);line-height:1.4;align-self:end}
/* 묶음 한 장 */
.og-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}
.og-pct{font-size:clamp(30px,3.6vw,52px);font-weight:700;line-height:1}
.og-pct small{font-size:clamp(16px,2.2vh,20px);color:var(--mut);margin-left:8px;font-weight:400}
.og-sum{font-size:clamp(24px,min(2.8vw,4vh),38px);font-weight:700;color:var(--orange-b);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
.og-list{display:flex;flex-direction:column;gap:clamp(8px,1.2vh,12px);flex:1;min-height:0;overflow:hidden}
.og-item{background:rgba(255,255,255,.08);border-left:6px solid #fff;border-radius:8px;padding:clamp(10px,1.4vh,16px) 22px;font-size:calc(clamp(24px,min(2.8vw,4vh),38px) * var(--fit,1));line-height:1.4}
.og-item::before{content:"“";color:var(--mut-2);margin-right:6px}
.og-item.rep{color:var(--orange-b);font-weight:700}   /* 묶음을 가장 잘 보여 주는 글 1~3개 (v3.8) */
.og-item .rtag{float:right;font-size:.55em;font-weight:700;color:var(--gg-d);background:var(--orange-b);border-radius:.4em;padding:.12em .6em;margin:.35em 0 0 .6em;line-height:1.3}
.grp .ex em{font-style:normal;color:var(--orange-b)}
.og-rest{margin-top:10px;font-size:clamp(18px,2.4vh,24px);color:var(--mut-2)}
/* 움직임 줄이기: 페이드·롤링·채우기 모두 0 */

  .lv-panel,.goal i,.grp .bar i,.sc,.track div{transition:none}

}
