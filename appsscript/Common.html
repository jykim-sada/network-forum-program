    screenReport: function (info) {   // 서버 screenReport 와 같은 규칙
      var d = load(); var v = info && isObj(info.video) ? info.video : null; var id = String((info && info.id) || '').slice(0, 40);
      var o = { at: Date.now(), id: id, video: v ? { name: String(v.name || '').slice(0, 80), size: Number(v.size) || 0, dur: Number(v.dur) || 0 } : null }; var prev = d.screen || null;
      if (!o.video && prev && prev.video && prev.id && prev.id !== id) return { ok: true, kept: true };
      var same = !!prev && prev.id === id && JSON.stringify(prev.video) === JSON.stringify(o.video); d.screen = o; if (same) save(d); else bump(d); return { ok: true, same: same };
    },
    adminReset: function (pin, mode) {
      var d = load();
      if (mode === 'all') { var prog = d.program; d = empty(); d.program = prog; }   // 전체 비우기: 기록·한줄·분석·상태만. 프로그램은 유지
      else if (mode === 'lines') d.lines = [];
      else if (mode === 'state') d.state = emptyState();
      else return fail('초기화 종류 오류 (state·lines·all)');
      bump(d); return { ok: true };
    },
    /* 로컬 전용: 예시 데이터(기록 18건·한줄 24건·프로그램·명단·규칙 기반 분석) 채우기 */
    mockFillDemo: function () {
      var d = load(); var now = Date.now();
      d.records = emptyRecords();
      TABLES.forEach(function (t) { [1, 2].forEach(function (r) { var x = DEMO_RECORDS[t][r - 1]; d.records[t][r] = { note: x[0], wish: x[1], updatedAt: nowHM(), done: !((t === 4 && r === 2) || (t === 7 && r === 1)) }; }); });   // Code.gs demoDone_ 와 같음
      d.lines = DEMO_LINES.map(function (x, i) { var ts = now - (DEMO_LINES.length - i) * 60000; var dt = new Date(ts); return { id: 'demo' + i, ts: ts, at: pad(dt.getHours()) + ':' + pad(dt.getMinutes()), text: x[0], dev: 'demo' + i, hidden: false, del: false, edited: 0, done: i % 2 === 0, table: x[1] }; });
      d.program = mergeProgram(demoProgram());
      d.analysis = analyze(d); d.state.analyzed = true; d.state.analyzedAt = now;
      bump(d); return { ok: true, records: 18, lines: d.lines.length, tables: d.analysis.tables.length };
    },
    mockSimLine: function (text) { var r = fns.addLine(text, 'sim-' + uid(), 1 + Math.floor(Math.random() * 9)); if (!r.ok) return r; var d = load(); d.lines.forEach(function (o) { if (o.id === r.id && Math.random() < 0.7) o.done = true; }); bump(d); return r; }
  };
  return { call: function (fn, args, cb, eb) { try { if (!fns[fn]) throw new Error('없는 함수: ' + fn); var r = fns[fn].apply(null, args || []); setTimeout(function () { cb && cb(r); }, 60); } catch (e) { console.error(e); eb && eb(e); } } };
})();
</script>
