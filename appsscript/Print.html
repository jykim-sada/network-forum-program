<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테이블 QR 인쇄 · 네트워크 포럼 운영 프로그램</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@font-face{font-family:'GyeonggiTitle';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/GyeonggiTitle/GyeonggiTitle-Medium.woff2') format('woff2')}
@font-face{font-family:'GyeonggiTitle';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/GyeonggiTitle/GyeonggiTitle-Bold.woff2') format('woff2')}
:root{--gg:#0E4194;--teal:#00A496;--lime:#ABCD03;--orange:#F39800;--deep:#ED6100;--bg:#F1F4F9;--line:#DEE4EE;--muted:#5F6979;--soft:#EEF2F8;--t1:#00A496;--t2:#ABCD03;--t3:#F39800;--t4:#ED6100}
@page{size:A4 portrait;margin:10mm}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#000;font-family:"GyeonggiTitle","Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button{font:inherit;cursor:pointer}
/* 화면용 도구줄: 인쇄할 때는 숨김 */
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.toolbar b{color:var(--gg)}
.toolbar small{color:var(--muted)}
.toolbar .sp{flex:1}
.btn{background:var(--gg);color:#fff;border:0;border-radius:6px;padding:8px 18px;font-weight:700}
.sheets{padding:16px 0 40px}
/* 한 장 = A4 세로 한 페이지 */
.sheet{background:#fff;color:#000;width:210mm;max-width:100%;min-height:297mm;margin:0 auto 16px;padding:12mm 14mm 14mm;box-shadow:0 2px 12px rgba(14,65,148,.10);display:flex;flex-direction:column;page-break-after:always;break-after:page}
.ciband{display:flex;align-items:center;gap:14px;padding:0 0 8px}
.ciband img.gg{height:26px;width:auto;display:block}.ciband img.hc{height:34px;width:auto;display:block}
.ciband .sp{flex:1}.ciband .ttl{color:var(--gg);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tri{height:5px;display:flex}.tri i{flex:1}
.tri i:nth-child(1){background:var(--teal)}.tri i:nth-child(2){background:var(--lime)}.tri i:nth-child(3){background:var(--orange)}
.num{text-align:center;margin:10mm 0 4mm}
.num small{display:block;font-size:14pt;letter-spacing:.14em;color:var(--muted)}
.num b{display:block;font-size:150pt;line-height:1;font-weight:700;color:var(--gg);font-variant-numeric:tabular-nums}
.num span{display:block;font-size:22pt;font-weight:700;margin-top:2mm}
.topic{display:flex;align-items:center;gap:12px;border-left:14px solid var(--gg);border-radius:0 8px 8px 0;background:var(--soft);padding:9px 14px;margin:0 0 4mm}
.topic.t1{border-color:var(--t1)}.topic.t2{border-color:var(--t2)}.topic.t3{border-color:var(--t3)}.topic.t4{border-color:var(--t4)}
.topic .tno{font-size:12pt;font-weight:700;color:var(--gg);white-space:nowrap}
.topic b{font-size:19pt;line-height:1.3;flex:1}
.topic small{font-size:12pt;color:var(--muted);white-space:nowrap}
.hall{text-align:center;font-size:18pt;font-weight:700;margin:0 0 4mm}
.qrbox{text-align:center;margin:auto 0;padding:4mm 0}
.qrbox .qr{display:inline-block;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.qrbox .qr > *{margin:0 auto}
.qrmsg{font-size:15pt;font-weight:700;margin:5mm 0 1mm}
.url{font-family:Consolas,monospace;font-size:9pt;color:var(--muted);word-break:break-all;margin:0}
.roles{margin-top:auto;border-top:1px solid var(--line);padding-top:5mm;display:grid;gap:5mm}
.roles div{display:flex;align-items:flex-end;gap:10px;font-size:12pt}
.roles b{width:22mm;color:var(--gg);white-space:nowrap}
.roles span{white-space:nowrap}
.roles i{flex:1;border-bottom:1px solid #000;height:1.4em}
@media (max-width:820px){.num b{font-size:120pt}.topic{flex-wrap:wrap}.roles div{flex-wrap:wrap}}
@media print{html,body{background:#fff}.toolbar{display:none}.sheets{padding:0}.sheet{width:auto;max-width:none;height:275mm;min-height:0;margin:0;padding:6mm 8mm;box-shadow:none;overflow:hidden}.sheet:last-child{page-break-after:auto;break-after:auto}}
</style>
</head>
<body>
<script>var CFG = <?!= CFG ?>;</script>
<?!= include('Common') ?>
<div class="toolbar"><b>테이블 QR 인쇄</b><small>A4 세로 9장 · 테이블마다 1장 · 브라우저 인쇄 설정에서 「배경 그래픽」을 켜 주세요</small><span class="sp"></span><button class="btn" id="btnPrint">인쇄</button></div>
<div class="sheets" id="sheets"></div>
<script>
/* 테이블별 오늘의 한줄 주소: Apps Script 에서는 ?page=phone&t=N, 로컬 미리보기에서는 Phone.html?t=N */
function phoneUrlFor(t) { return pageUrlWith('phone', 't=' + t); }
function sheetHTML(t) {
  var tp = topicOf(t);
  return '<section class="sheet">' + brandHTML('ciband') +
    '<div class="num"><small>TABLE</small><b>' + t + '</b><span>' + t + '번 테이블</span></div>' +
    '<div class="topic t' + tp.id + '"><span class="tno">주제 ' + tp.id + '</span><b>' + esc(tp.title) + '</b><small>' + esc(tp.sub) + '</small></div>' +
    '<div class="hall">' + esc(HALL[t]) + '</div>' +
    '<div class="qrbox"><div class="qr" id="qr' + t + '"></div><p class="qrmsg">QR을 찍고 오늘의 한줄을 적어 주세요 · 무기명</p><p class="url">' + esc(phoneUrlFor(t)) + '</p></div>' +
    '<div class="roles">' + [1, 2].map(function (r) { return '<div><b>' + r + '라운드</b><span>퍼실리테이터</span><i></i><span>기록자</span><i></i></div>'; }).join('') + '</div>' +
    '</section>';
}
document.getElementById('sheets').innerHTML = TABLES.map(sheetHTML).join('');
TABLES.forEach(function (t) { qrInto(document.getElementById('qr' + t), phoneUrlFor(t), 220); });
document.getElementById('btnPrint').onclick = function () { window.print(); };
</script>
</body>
</html>
