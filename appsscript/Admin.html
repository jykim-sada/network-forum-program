  v.innerHTML = '<h2>테이블 현황</h2><p class="hint">기록자 9명의 기록이 실시간으로 모입니다. 기록자가 「저장」을 누르면 「작성 완료」, 그 뒤에 고치면 다시 「작성 중」입니다. 15:05에 「휴식·취합」 단계로 넘기면 입력이 마감되고, 여기서 분석을 실행합니다.</p>' +
    '<div class="row" style="margin-bottom:10px"><span class="pill ' + (done === 18 ? 'ok' : 'warn') + '">기록 ' + done + '/18건 완료</span><span class="pill ' + (s.closed ? 'ok' : 'wait') + '">' + (s.closed ? '입력 마감됨' : '입력 진행 중') + '</span><span class="pill ' + (s.analyzed ? 'ok' : 'wait') + '">' + (s.analyzed ? '분석 완료' : '분석 전') + '</span><span class="pill ' + (hasKey ? 'ok' : 'warn') + '">' + (hasKey ? 'Claude 분석 사용' : 'API 키 없음 · 규칙 기반') + '</span></div>' +
    '<div class="agrid">' + TABLES.map(function (t) { var tp = topicOf(t); return '<div class="tcard bd-t' + tp.id + '"><h4><span>테이블 ' + t + ' <small style="color:var(--muted);font-weight:400">' + HALL[t] + '</small></span><span class="tb t' + tp.id + '">주제 ' + tp.id + '</span></h4>' + [1, 2].map(function (r) { var x = rec(t, r); return '<div class="st"><span>' + r + '라운드' + (x.updatedAt ? ' <small style="color:var(--muted)">' + esc(x.updatedAt) + '</small>' : '') + '</span><span>' + (x.wish ? '<span class="pill ok">바라는 것 있음</span> ' : '<span class="pill wait">바라는 것 없음</span> ') + stPill(t, r) + '</span></div>'; }).join('') + '<a class="btn sm ghost" style="margin-top:8px;display:block;text-align:center" href="' + pageUrlWith('recorder', 'no=' + t) + '" target="_blank">기록자 화면 열기</a></div>'; }).join('') + '</div>' +
    '<div class="actions"><button class="btn ' + (s.closed ? 'ghost' : '') + '" id="btnClose">' + (s.closed ? '입력 다시 열기' : '입력 마감 (15:05)') + '</button><button class="btn accent" id="btnAna" ' + (analyzing ? 'disabled' : '') + '>' + (analyzing ? '분석 중… (30초~2분)' : s.analyzed ? '분석 다시 실행' : '분석 실행') + '</button><span style="font-size:12px;color:var(--muted)">분석은 몇 번이든 다시 실행할 수 있습니다. 결과는 「분석」 시트에 쌓입니다.</span></div>';
  v.querySelector('#btnClose').onclick = function () { setState({ closed: !s.closed }, s.closed ? '입력을 다시 열었습니다' : '입력을 마감했습니다'); };
  v.querySelector('#btnAna').onclick = function () { analyzing = true; render(); admin('adminAnalyze', [], function (r) { analyzing = false; if (r && r.ok === false) { toast('분석 실패: ' + (r.error || ''), true); render(); return; } toast('분석 완료 · ' + (r && r.engine ? r.engine : '')); L.view = 'analysis'; saveL(); render(); }, function () { analyzing = false; render(); }); setTimeout(function () { if (analyzing) { analyzing = false; render(); } }, 180000); };
}

/* ---- 분석·결과 ---- */
function tablesTableHTML(cls) {
  return '<table class="' + cls + '"><tr><th>테이블</th><th>주제</th><th>한 문장</th><th>핵심</th><th>바라는 것</th></tr>' + TABLES.map(function (t) { var x = tableAnalysis(t); var tp = topicOf(t); return '<tr><td><b>' + t + '</b></td><td><span class="tb t' + tp.id + '">주제 ' + tp.id + '</span></td>' + (x ? '<td>' + esc(x.one) + '</td><td><ol>' + (x.points || []).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol></td><td>' + esc(x.wish) + '</td>' : '<td colspan="3" style="color:var(--muted)">(분석 전)</td>') + '</tr>'; }).join('') + '</table>';
}
function renderAnalysis() {
  var v = document.getElementById('view-analysis'); var a = S.analysis; var o = onelineSummary();
  v.innerHTML = '<h2>분석·결과</h2><p class="hint">15:05~15:25 취합 시간에 기록 18건과 오늘의 한줄을 정리한 결과입니다. 결과공유 장표와 보고서에 그대로 쓰입니다.</p>' +
    (a ? ('<div class="row" style="margin-bottom:10px"><span class="pill ok">' + esc(a.engine || '') + '</span><span class="pill">' + esc(a.at || '') + '</span><button class="btn sm ghost" id="reAna">테이블 현황에서 다시 실행</button></div>' +
      '<section class="card" style="margin-bottom:10px"><h3>테이블별 정리<small>한 문장 · 핵심(최대 6가지) · 경기도에 바라는 것 — 결과공유 테이블 장표</small></h3><div class="scroll">' + tablesTableHTML('tbl') + '</div></section>' +
      '<section class="card" style="margin-bottom:10px"><h3>오늘의 한줄 · 같은 뜻끼리 묶음<small>' + o.goal.lines + '개 · ' + o.groups.length + '묶음</small></h3>' + o.groups.map(function (x) { return '<div class="grp"><i style="background:' + x.color + '"></i><div><b>' + esc(x.name) + '</b><small>' + esc(x.sum) + (x.examples.length ? ' · 예: ' + x.examples.slice(0, 2).map(esc).join(' / ') : '') + '</small></div><div class="p">' + x.pct + '%<small>' + x.n + '개</small></div></div>'; }).join('') + '<p style="margin:10px 0 0;font-size:14px"><b>요약</b> ' + esc(o.say) + '</p></section>' +
      '<div class="ana">' + TOPICS.map(function (tp) { var t = topicAnalysis(tp.id) || { sum: '(없음)', kw: [], sug: [] }; return '<div class="card bd-t' + tp.id + '"><span class="tb t' + tp.id + '">주제 ' + tp.id + '</span> <b>' + esc(tp.title) + '</b> <span style="color:var(--muted)">(' + esc(tp.sub) + ') · 테이블 ' + tp.tables.join('·') + '</span><p>' + esc(t.sum) + '</p><div class="chips">' + (t.kw || []).map(function (k) { return '<span>' + esc(k) + '</span>'; }).join('') + '</div><p style="margin-top:8px"><b>건의사항</b></p><ul>' + (t.sug || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'; }).join('') + '</div>' +
      '<section class="card" style="margin-top:10px"><h3>건의사항 종합<small>결과공유 마지막에 경기도 응답</small></h3><ol style="margin:0;padding-left:20px">' + (a.wishes || []).map(function (w) { return '<li>' + esc(w.text) + ' <span style="color:var(--muted);font-size:12px">' + esc(w.tables) + '</span></li>'; }).join('') + '</ol></section>')
    : '<section class="card"><p style="color:var(--muted);margin:0 0 10px">아직 분석 전입니다. 테이블 현황에서 입력을 마감한 뒤 「분석 실행」을 누르세요.</p><button class="btn ghost" id="goTables">테이블 현황으로</button></section>');
  var g = v.querySelector('#goTables'); if (g) g.onclick = function () { L.view = 'tables'; saveL(); render(); };
  var r = v.querySelector('#reAna'); if (r) r.onclick = function () { L.view = 'tables'; saveL(); render(); };
}

/* ---- 보고서 ---- */
function renderReport() {
  var v = document.getElementById('view-report'); var a = S.analysis; var o = onelineSummary(); var lines = visibleLines();
  var wishes = (a && a.wishes) ? a.wishes : []; if (!(a && a.wishes)) TABLES.forEach(function (t) { [1, 2].forEach(function (r) { var w = rec(t, r).wish; if (w) wishes.push({ text: w, tables: '테이블 ' + t + ' · ' + r + '라운드' }); }); });
  v.innerHTML = '<div class="row noprint" style="margin-bottom:10px"><h2 style="margin:0">보고서(PDF) <span class="pill">경기도 제출용 기초자료</span></h2><button class="btn accent" id="rpPrint" style="margin-left:auto">PDF로 저장 (인쇄)</button></div><p class="hint">브라우저 인쇄에서 PDF로 저장을 고르면 이 페이지가 그대로 PDF가 됩니다. 원문은 시트에 그대로 보존됩니다.</p>' +
    '<article class="rep"><h1>「' + esc(EVENT.name) + '」 참여토론 결과 (발표보드)</h1><div class="meta">' + esc(EVENT.date) + ' ' + esc(EVENT.time) + ' · ' + esc(EVENT.place) + ' · 9테이블 × 2라운드 · 주제 4개' + (a ? ' · 분석: ' + esc(a.engine || '') + ' ' + esc(a.at || '') : ' · 분석 전') + '</div>' +
    '<h2>1. 주제별 종합</h2>' + TOPICS.map(function (tp) { var t = topicAnalysis(tp.id); return '<h3>주제 ' + tp.id + '. ' + esc(tp.title) + ' (' + esc(tp.sub) + ') · 테이블 ' + tp.tables.join('·') + '</h3>' + (t ? '<p style="margin:4px 0">' + esc(t.sum) + '</p><p style="margin:2px 0;font-size:13px"><b>핵심어</b> ' + (t.kw || []).map(esc).join(' · ') + '</p><ul>' + (t.sug || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p style="color:var(--muted)">(분석 전)</p>'); }).join('') +
    '<h2>2. 건의사항 종합</h2><table><tr><th>번호</th><th>건의사항</th><th>제안 테이블</th></tr>' + (wishes.map(function (w, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(w.text) + '</td><td>' + esc(w.tables) + '</td></tr>'; }).join('') || '<tr><td colspan="3" style="color:var(--muted)">(없음)</td></tr>') + '</table>' +
    '<h2>3. 테이블별 정리(AI)' + (a ? '<small>' + esc(a.engine || '') + '</small>' : '') + '</h2>' + tablesTableHTML('') +
    '<h2>4. 테이블별 기록 원문</h2>' + TABLES.map(function (t) { var tp = topicOf(t); return '<h3>테이블 ' + t + ' · 주제 ' + tp.id + ' ' + esc(tp.title) + ' · ' + HALL[t] + '</h3>' + [1, 2].map(function (r) { var x = rec(t, r); return '<table><tr><th style="width:110px">' + r + '라운드' + (x.updatedAt ? ' <span style="font-weight:400;color:var(--muted)">' + esc(x.updatedAt) + '</span>' : '') + '</th><th>내용</th></tr><tr><td>기록</td><td>' + (brLines(x.note) || '—') + '</td></tr><tr><td>바라는 것</td><td>' + (brLines(x.wish) || '—') + '</td></tr></table>'; }).join(''); }).join('') +
    '<h2>5. 오늘의 한줄 (' + lines.length + '건 · ' + o.goal.writers + '명)</h2><p style="font-size:14px">' + esc(o.say) + '</p><table><tr><th>묶음</th><th>건수</th><th>비율</th><th>대표 문장 · 예시</th></tr>' + o.groups.map(function (x) { return '<tr><td>' + esc(x.name) + '</td><td>' + x.n + '</td><td>' + x.pct + '%</td><td>' + esc(x.sum) + (x.examples.length ? '<br><span style="color:var(--muted)">' + x.examples.map(esc).join(' / ') + '</span>' : '') + '</td></tr>'; }).join('') + '</table><ul>' + lines.map(function (x) { var tn = Number(x.table) || 0; return '<li>' + esc(x.text) + ' <span style="color:var(--muted);font-size:12px">' + (tn ? '테이블 ' + tn + ' · ' : '') + esc(x.at) + '</span></li>'; }).join('') + '</ul></article>';
  v.querySelector('#rpPrint').onclick = function () { window.print(); };
}

/* ---- 총괄 ---- */
function render() {
  if (!S.state) return;
  renderStatus();
  if (VIEWS.indexOf(L.view) < 0) L.view = 'control';
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === L.view); b.onclick = function () { L.view = b.dataset.v; saveL(); render(); }; });
  document.querySelectorAll('.view').forEach(function (el) { el.classList.toggle('on', el.id === 'view-' + L.view); });
  ({ control: renderControl, program: renderProgram, roster: renderRoster, oneline: renderOneline, tables: renderTables, analysis: renderAnalysis, report: renderReport })[L.view]();
}
document.getElementById('brand').innerHTML = brandHTML('ciband');
document.getElementById('evline').textContent = EVENT.name + ' · 발표보드 백단';
/* 라운드 중 1초 틱: 타이머 숫자만 바꾸고(미리보기 iframe 이 매초 다시 뜨지 않게), 1분에 한 번 전체를 다시 그린다 */
setInterval(function () { var ph = phase(); if (!((ph === 'r1' || ph === 'r2') && L.view === 'control' && S.state && !typing())) return; var el = document.querySelector('#view-control .timer'); var rs = roundState(); if (el && rs && el.firstChild && el.firstChild.nodeType === 3 && rs.secLeft % 60 !== 0) { el.firstChild.nodeValue = pad(Math.floor(rs.secLeft / 60)) + ':' + pad(rs.secLeft % 60) + ' '; } else render(); }, 1000);
</script>
</body>
</html>
