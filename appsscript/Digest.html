<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크린 자료집 · 네트워크 포럼 운영 프로그램</title>
<style>
/* 스크린 자료집 (v3.20): 행사 중 스크린에 표출된 장표의 내용을 글로 옮긴 읽기 문서. 웹(브라우저)과 A4 인쇄(PDF) 겸용.
   어두운 파란 스크린 → 흰 종이: 배경만 뒤집고 구조색(주제색 띠·칩, 묶음색)은 남긴다. 글자색은 검정·파랑·회색·진주황·청록만(연두·주황은 띠와 칩에만).
   오프닝 영상 장은 넣지 않는다. 당일 흐름(등록 → 1부 → 2부 → 토론 → 결과공유 → 마무리) 순서. */
@font-face{font-family:'GyeonggiTitle';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/GyeonggiTitle/GyeonggiTitle-Medium.woff2') format('woff2')}
@font-face{font-family:'GyeonggiTitle';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/GyeonggiTitle/GyeonggiTitle-Bold.woff2') format('woff2')}
:root{--gg:#0E4194;--gg-l:#1B5AAE;--gg-d:#072448;--teal:#00A496;--lime:#ABCD03;--orange:#F39800;--deep:#ED6100;--yellow:#EDC300;--green:#299738;--bg:#F1F4F9;--line:#DEE4EE;--muted:#5F6979;--soft:#EEF2F8;--ink:#111;--t1:#00A496;--t2:#ABCD03;--t3:#F39800;--t4:#ED6100;--deep-t:#C24F00;--teal-t:#00796E;--green-t:#1F7A2C}
@page{size:A4 portrait;margin:14mm 14mm 17mm}
@page{@bottom-left{content:"경기도 중장년 네트워크 포럼 · 2026. 10. 28. · 스크린 자료집 (글판)";font-family:"GyeonggiTitle","Malgun Gothic","맑은 고딕",sans-serif;font-size:9pt;color:#4A5566}@bottom-right{content:counter(page) " / " counter(pages);font-family:"GyeonggiTitle","Malgun Gothic","맑은 고딕",sans-serif;font-size:9pt;color:#4A5566}}
@page :first{@bottom-left{content:none}@bottom-right{content:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"GyeonggiTitle","Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:11.5pt;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button{font:inherit;cursor:pointer}
a{color:var(--gg)}
.nw{white-space:nowrap}
p,li,td,th{orphans:3;widows:3}
h2,h3{break-after:avoid;page-break-after:avoid}
/* 화면용 도구줄 */
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.toolbar b{color:var(--gg)}.toolbar small{color:var(--muted)}.toolbar .sp{flex:1}
.btn{background:var(--gg);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:700;text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost{background:#fff;color:var(--gg);border:1px solid var(--gg)}
.btn.sm{padding:6px 10px;font-size:10.5pt}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.zoom button{border:0;background:#fff;padding:6px 11px;color:var(--gg);font-weight:700}.zoom button+button{border-left:1px solid var(--line)}.zoom button.on{background:var(--soft)}
/* 문서 본체: 화면에서는 종이 한 장처럼 */
.doc{max-width:900px;margin:18px auto 70px;background:#fff;padding:36px 48px 48px;box-shadow:0 2px 14px rgba(14,65,148,.10)}
.loading,.err{padding:40px;text-align:center;color:var(--muted)}.err{color:#B23A2E}
.pg{padding:30px 0 10px;border-top:1px dashed var(--line)}.pg.first{border-top:0;padding-top:0}
.avoid{break-inside:avoid;page-break-inside:avoid}
/* 로고 띠 */
.ciband{display:flex;align-items:center;gap:14px;padding:0 0 8px}
.ciband img.gg{height:24px;width:auto;display:block}.ciband img.hc{height:32px;width:auto;display:block}
.ciband .sp{flex:1}.ciband .ttl{color:var(--gg);font-size:10.5pt;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tri{height:4px;display:flex;margin-bottom:22px}.tri i{flex:1}
.tri i:nth-child(1){background:var(--teal)}.tri i:nth-child(2){background:var(--lime)}.tri i:nth-child(3){background:var(--orange)}
/* 표지 */
.cover{min-height:230mm;display:flex;flex-direction:column}
.cover .kind{display:inline-block;align-self:flex-start;background:var(--gg);color:#fff;font-weight:700;font-size:10.5pt;letter-spacing:.08em;padding:4px 14px;border-radius:4px;margin:40mm 0 14px}
.cover h1{font-size:30pt;line-height:1.2;margin:0 0 8px;color:var(--gg);letter-spacing:-.02em}
.cover .slogan{font-size:16pt;font-weight:700;color:var(--teal);margin:0 0 24px}
.cover .box{background:var(--soft);border-radius:10px;padding:14px 18px;font-size:11.5pt;line-height:1.7}
.cover .box b{color:var(--gg);display:inline-block;min-width:3.2em}
.cover .stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
.cover .stats div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.cover .stats b{display:block;font-size:18pt;color:var(--gg);line-height:1.2}.cover .stats span{font-size:9.5pt;color:var(--muted)}
.cover .desc{font-size:10.5pt;color:var(--muted);margin:auto 0 0;line-height:1.7;padding-top:30px}
/* 차례·오늘의 흐름 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.toc h3,.tl h3{margin:0 0 10px;font-size:13pt;color:var(--gg);padding-bottom:4px;border-bottom:2px solid var(--gg)}
.toc ol{margin:0;padding-left:1.6em;font-size:11pt;line-height:1.8}
.toc li a{text-decoration:none;color:var(--ink)}.toc li small{color:var(--muted);font-size:9.5pt;margin-left:4px}
.tl table{width:100%;border-collapse:collapse;font-size:10.5pt}
.tl td{padding:5px 6px 5px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.tl td.t{white-space:nowrap;color:var(--muted);width:6.2em;font-variant-numeric:tabular-nums}
.tl td.s{white-space:nowrap;font-weight:700;color:var(--gg);width:6.6em}
.tl td.w{color:#333}
/* 절 머리 */
.sec{margin:0 0 18px}
.sec .ph{display:inline-block;font-size:9.5pt;font-weight:700;letter-spacing:.06em;color:var(--gg);background:var(--soft);border-radius:4px;padding:2px 10px;margin-bottom:8px}
.sec h2{font-size:19pt;line-height:1.25;margin:0;color:var(--gg);letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 .no{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--gg);color:#fff;font-size:12pt}
.sec h2 small{font-size:12pt;color:var(--muted);font-weight:400}
.sec .sub{font-size:12pt;font-weight:700;color:var(--deep-t);margin:4px 0 0}
.sec .lead{font-size:10.5pt;color:var(--muted);margin:6px 0 0}
h3.h{font-size:14pt;margin:22px 0 10px;color:var(--gg);padding-bottom:4px;border-bottom:2px solid var(--gg)}
h3.h small{font-weight:400;font-size:9.5pt;color:var(--muted);margin-left:8px}
.note{background:var(--soft);border-left:5px solid var(--gg);border-radius:0 8px 8px 0;padding:10px 14px;font-size:10.5pt;color:#333;margin:12px 0}
.note b{color:var(--gg)}
.note .row{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:2px 10px;align-items:baseline;margin:3px 0}
.note .row .k{font-weight:700;color:var(--gg)}
.src,.fn{font-size:9.5pt;color:var(--muted);margin:6px 0 0}
/* 칩 */
.chip{display:inline-block;padding:3px 12px;border-radius:5px;font-weight:700;font-size:10.5pt;line-height:1.4;border:1px solid transparent}
.chip.t1{background:var(--t1);color:var(--gg-d);border-color:var(--t1)}.chip.t2{background:var(--t2);color:var(--gg-d);border-color:var(--t2)}.chip.t3{background:var(--t3);color:var(--gg-d);border-color:var(--t3)}.chip.t4{background:var(--deep-t);color:#fff;border-color:var(--deep-t)}
.chip.greet{background:var(--teal);color:var(--gg-d);border-color:var(--teal)}.chip.cong{background:var(--orange);color:var(--gg-d);border-color:var(--orange)}
/* 1부: 인사말·축사·발표 */
.greet{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.greet .chip{flex:none;min-width:70px;text-align:center}
.greet .org{font-size:12pt;color:var(--muted)}.greet .nm{font-size:20pt;font-weight:700;line-height:1.2;margin-top:2px}
.spk{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.spk .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gg);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12pt;margin-top:4px}
.spk .t{font-size:17pt;font-weight:700;color:var(--deep);line-height:1.3;letter-spacing:-.01em}
.spk .t::before{content:"“";color:var(--gg)}.spk .t::after{content:"”";color:var(--gg)}
.spk .n{font-size:12.5pt;margin-top:4px}
.divider{text-align:center;padding:26px 0 14px}
.divider .t{font-size:21pt;font-weight:700;color:var(--gg);letter-spacing:-.02em;line-height:1.25}
.divider .s{font-size:12.5pt;color:var(--deep-t);font-weight:700;margin-top:6px}
/* 토론 주제 4 */
.tp4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:12px 0}
.tpc{border:1px solid var(--line);border-top:7px solid var(--rc);border-radius:8px;padding:14px 16px 12px;background:#fff}
.tpc.t1{--rc:var(--t1)}.tpc.t2{--rc:var(--t2)}.tpc.t3{--rc:var(--t3)}.tpc.t4{--rc:var(--t4)}
.tpc .k{display:inline-block;font-size:9.5pt;font-weight:700;background:var(--rc);color:var(--gg-d);border-radius:4px;padding:2px 9px;margin-bottom:8px}
.tpc.t4 .k{color:#fff}
.tpc h4{margin:0 0 6px;font-size:15pt;line-height:1.3;color:var(--ink);letter-spacing:-.015em}
.tpc .ask{font-size:11pt;color:var(--muted);margin:0 0 8px;line-height:1.5}
.tpc .tb{font-size:10.5pt;font-weight:700;color:var(--gg)}
/* 명단 3×3 · 이름 찾기 */
.g9{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.c9{border:1px solid var(--line);border-left:6px solid var(--rc);border-radius:6px;padding:8px 10px 10px;min-height:92px}
.c9.t1{--rc:var(--t1)}.c9.t2{--rc:var(--t2)}.c9.t3{--rc:var(--t3)}.c9.t4{--rc:var(--t4)}
.c9 .ch{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:9.5pt;color:var(--muted);margin-bottom:6px}
.c9 .ch b{font-size:15pt;color:var(--gg);line-height:1}
.c9 .names{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 6px;font-size:11pt}
.c9 .names span{white-space:nowrap}
.c9 .none{color:var(--muted);font-size:10pt}
.idx{columns:3;column-gap:22px;margin:10px 0 0;padding:0;list-style:none;font-size:10.5pt}
.idx li{break-inside:avoid;page-break-inside:avoid;display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.idx li b{white-space:nowrap}.idx li span{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 표 */
table.tb{width:100%;border-collapse:collapse;font-size:11pt;margin:8px 0 14px}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left}
table.tb th{background:var(--soft);color:var(--gg);font-size:10pt;white-space:nowrap}
table.tb thead{display:table-header-group}
table.tb tr{break-inside:avoid;page-break-inside:avoid}
table.tb.lines{font-size:12pt;line-height:1.45}table.tb.lines td{padding:5px 9px}
table.tb td.num{text-align:right;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;width:2.6em}
table.tb td.at{color:var(--muted);white-space:nowrap;width:4.2em;font-variant-numeric:tabular-nums}
.tdot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}
/* 경기도 중장년 지금 */
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0}
.fcell{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px 12px 10px}
.fcell .fv{font-size:19pt;font-weight:700;color:var(--deep);line-height:1.15;letter-spacing:-.02em}
.fcell .fk{font-size:10.5pt;font-weight:700;margin-top:4px}.fcell .fs{font-size:9.5pt;color:var(--muted);margin-top:2px}
.ffoot{font-size:11pt;font-weight:700;color:var(--gg);margin:6px 0 0}
/* 트렌드 카드 */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 4px}
.tcard{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tcard .tn{display:inline-block;font-size:9.5pt;font-weight:700;color:#fff;background:var(--ac);border-radius:4px;padding:1px 8px}
.tcard.a1{--ac:var(--deep-t)}.tcard.a2{--ac:var(--teal-t)}.tcard.a3{--ac:var(--green-t)}.tcard.a4{--ac:var(--gg-l)}
.tcard .tw{font-size:14pt;font-weight:700;margin:6px 0 4px;color:var(--ink)}
.tcard .ts{font-size:10.5pt;color:#333;line-height:1.5}.tcard .tm{font-size:10pt;color:var(--muted);margin-top:4px}
/* 한줄 요약 */
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.kpi div{flex:1 1 120px;background:var(--soft);border-radius:8px;padding:10px 14px}
.kpi b{display:block;font-size:18pt;color:var(--gg);line-height:1.2}.kpi span{font-size:9.5pt;color:var(--muted)}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:8px 0 14px;border:1px solid var(--line)}
.stack i{display:flex;align-items:center;justify-content:center;font-size:9.5pt;font-weight:700;color:var(--gg-d);overflow:hidden;white-space:nowrap}
.stack i.dk{color:#fff}
.grp-row td.c{width:14px;padding:6px 4px}.grp-row td.c i{display:block;width:12px;height:12px;border-radius:3px}
.grp-row td.p{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.grp-row td.nm{white-space:nowrap}
.grp-row em{color:var(--muted);font-style:normal}
.kwbars{margin:6px 0 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
.kwbars div{display:grid;grid-template-columns:7em 1fr 2em;align-items:center;gap:8px;font-size:10.5pt}
.kwbars b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kwbars i{display:block;height:10px;border-radius:3px;background:var(--gg-l)}
.kwbars span{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:9.5pt}
.say{border-left:6px solid var(--deep);background:var(--soft);padding:10px 14px;font-size:12pt;line-height:1.6;margin:12px 0;border-radius:0 8px 8px 0}
/* 묶음 */
.og{margin:0 0 18px;padding:14px 0 6px;border-top:1px solid var(--line)}
.og .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.og .hd .chip{font-size:11pt}
.og .pct{font-size:15pt;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.og .pct small{font-size:9.5pt;color:var(--muted);font-weight:400;margin-left:4px}
.og .sum{font-size:12.5pt;font-weight:700;margin:0 0 8px;line-height:1.45}
.og .item{border-left:5px solid var(--gc);padding:4px 10px;margin:4px 0;font-size:11pt;line-height:1.5}
.og .item.rep{font-weight:700;background:var(--soft)}
.og .item .rtag{display:inline-block;font-style:normal;font-size:8.5pt;font-weight:700;color:#fff;background:var(--deep);border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:1px}
.og .rest{font-size:10pt;color:var(--muted);margin-top:6px}
/* 테이블 정리: 테이블마다 한 쪽 */
.tbl{margin:0 0 16px;padding:18px 0 8px;border-top:1px solid var(--line)}
.tbl .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tbl .hd .tno{font-size:19pt;font-weight:700;color:var(--gg)}
.tbl .hd .hall{font-size:10.5pt;color:var(--muted)}
.tbl .body{display:grid;grid-template-columns:minmax(0,1fr) 34%;gap:18px;align-items:start}
.tbl .one{font-size:16pt;font-weight:700;color:var(--gg);line-height:1.4;margin:0 0 12px;letter-spacing:-.01em}
.tbl .one::before{content:"“";color:var(--deep)}.tbl .one::after{content:"”";color:var(--deep)}
.tbl ol.pts{margin:0 0 12px;padding-left:1.5em;font-size:11.5pt;line-height:1.55}
.tbl ol.pts li{margin-bottom:4px}.tbl ol.pts li::marker{color:var(--mc);font-weight:700}
.tbl.t1{--mc:var(--t1)}.tbl.t2{--mc:#7E9A00}.tbl.t3{--mc:#C97A00}.tbl.t4{--mc:var(--t4)}
.tbl .wish{border-left:5px solid var(--gg);background:var(--soft);border-radius:0 8px 8px 0;padding:10px 14px}
.tbl .wish b{display:block;color:var(--teal-t);font-size:10pt;letter-spacing:.06em;margin-bottom:2px}
.tbl .wish p{margin:0;font-size:12pt;line-height:1.55}
.tbl .kw{border-left:5px solid var(--rc);background:var(--soft);border-radius:0 8px 8px 0;padding:10px 12px}
.tbl.t1 .kw{--rc:var(--t1)}.tbl.t2 .kw{--rc:var(--t2)}.tbl.t3 .kw{--rc:var(--t3)}.tbl.t4 .kw{--rc:var(--t4)}
.tbl .kw b{display:block;font-size:9.5pt;letter-spacing:.06em;color:var(--gg);margin-bottom:6px}
.tbl .kw span{display:inline-block;margin:0 5px 5px 0;padding:2px 9px;border-radius:999px;background:#fff;border:1px solid #C9D2E0;font-size:10.5pt;font-weight:600}
.tbl .kw span.k1{background:var(--rc);border-color:var(--rc);color:var(--gg-d);font-size:11.5pt}
.tbl.t4 .kw span.k1{color:#fff}
.tbl .seat{margin-top:16px;border-top:1px solid var(--line);padding-top:8px;font-size:10.5pt;color:#333}
.tbl .seat b{color:var(--gg);margin-right:6px}.tbl .seat div{margin:2px 0}
.tbl .pre{font-size:11pt;color:#333;white-space:pre-wrap}
/* 테이블별 기록 원문 */
.rec-tbl{padding:14px 0 6px;border-top:1px solid var(--line)}
.rec-tbl .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rec-tbl .hd .tno{font-size:17pt;font-weight:700;color:var(--gg)}
.rec-tbl .hd .hall{font-size:10.5pt;color:var(--muted)}
.rec-r{margin:8px 0 14px}
.rec-r h4{font-size:12pt;color:var(--gg);margin:0 0 6px;display:flex;gap:10px;align-items:baseline;break-after:avoid;page-break-after:avoid}
.rec-r h4 small{color:var(--muted);font-weight:400;font-size:9.5pt}
.rec-note{white-space:pre-wrap;font-size:11pt;line-height:1.65;margin:0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;orphans:3;widows:3}
.rec-wish{border-left:5px solid var(--gg);background:var(--soft);padding:8px 14px;margin:8px 0 0;border-radius:0 8px 8px 0;break-inside:avoid;page-break-inside:avoid}
.rec-wish b{display:block;color:var(--teal-t);font-size:10pt;letter-spacing:.06em}
.rec-wish p{margin:2px 0 0;white-space:pre-wrap;font-size:11pt;line-height:1.55}
/* 포럼의 키워드 */
.cloud{text-align:center;padding:10px 0}
.cloud .cl-t{font-size:20pt;font-weight:700;color:var(--gg);letter-spacing:-.02em;line-height:1.25}
.cloud .cl-s{font-size:10.5pt;color:var(--muted);margin:4px 0 16px}
.cloud .cw{display:inline-block;margin:4px 5px;padding:.15em .55em;border:2px solid var(--cc);color:var(--cc);border-radius:.35em;font-weight:700;line-height:1.25;background:#fff}
.cloud .cw.group{border-width:3px;background:var(--cc);color:var(--on)}
.cloud .cw.t2,.cloud .cw.t3{color:var(--gg-d)}
.cloud .cw.line{border-color:#B7C0CF;color:var(--muted);font-weight:500}
.cloud .lg{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:9.5pt;color:var(--muted);margin-top:14px}
.cloud .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
/* 마무리 */
.ending{min-height:200mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ending .ht{font-size:22pt;font-weight:700;color:var(--gg);letter-spacing:-.02em}
.ending .hs{font-size:13pt;font-weight:700;color:var(--teal-t);margin-top:6px}
.ending .thanks{font-size:40pt;font-weight:700;color:var(--gg);margin:40px 0 10px;letter-spacing:-.03em}
.ending .fin{font-size:10.5pt;color:var(--muted);max-width:520px;line-height:1.7;margin-top:30px}
.ending .pub{font-size:9.5pt;color:var(--muted);margin-top:26px}
@media screen and (max-width:820px){.doc{padding:20px 16px;margin:0}.tp4,.tgrid,.kwbars,.two{grid-template-columns:1fr}.g9{grid-template-columns:1fr 1fr}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.tbl .body{grid-template-columns:1fr}.idx{columns:2}.cover{min-height:0}.cover .kind{margin-top:10px}.cover .desc{padding-top:16px}}
@media screen and (max-width:520px){.g9{grid-template-columns:1fr}.c9 .names{grid-template-columns:repeat(3,minmax(0,1fr))}.idx{columns:1}}
@media print{
  html,body{background:#fff;font-size:11pt}
  .toolbar,.noprint{display:none!important}
  .doc{max-width:none;margin:0;padding:0;box-shadow:none;zoom:1!important}
  .pg{border-top:0;padding:0;break-before:page;page-break-before:always}
  .pg.first{break-before:auto;page-break-before:auto}
  .tbl+.tbl{break-before:page;page-break-before:always;border-top:0;padding-top:0}
  .rec-tbl+.rec-tbl{break-before:page;page-break-before:always;border-top:0;padding-top:0}   /* 기록 원문도 테이블마다 새 쪽 */
  .cover{min-height:258mm}
  .ending{min-height:258mm}
  #s7{break-before:auto;page-break-before:auto;padding-top:18px}   /* 묶음 상세는 요약에 이어서 (반쪽 방지) */
  .sec{break-after:avoid;page-break-after:avoid}
  .tri{margin-bottom:18px}
  a{color:inherit;text-decoration:none}
  .two{grid-template-columns:1fr}   /* 차례 → 오늘의 흐름 세로로 */
  .g9{grid-template-columns:repeat(2,minmax(0,1fr))}   /* 명단 칸은 2열(이름 4열이 넉넉히) */
  .tbl .body{grid-template-columns:1fr}   /* 테이블 쪽: 자주 나온 말은 아래로 (한 쪽에 한 테이블이라 자리가 넉넉) */
}

  var h = '<section class="pg" id="s5">' + secHead(5, '토론 1·2라운드 · ' + phTime('r1') + ' · ' + phTime('r2'), '토론 중 스크린에 흐른 자료', '', '라운드 진행 화면에는 남은 시간과 함께 「진행 현황」 「오늘 함께하신 분들」 「' + esc(f.title || '경기도 중장년, 지금') + '」 「' + esc(src) + '」 네 패널이 순환했습니다. 명단은 4절에 있습니다.');
  h += '<h3 class="h">진행 현황<small>테이블 · 홀 · 주제</small></h3><table class="tb"><thead><tr><th>테이블</th><th>홀</th><th>주제</th><th>주제명</th></tr></thead><tbody>' + TABLES.map(function (t) { var tp = tpOf(t); return '<tr><td><b>' + t + '</b></td><td>' + esc(HALL[t]) + '</td><td><span class="tdot" style="background:' + TC[tp.id] + '"></span>주제 ' + tp.id + ' · ' + esc(tp.sub) + '</td><td>' + kq(tp.title) + '</td></tr>'; }).join('') + '</tbody></table><p class="fn">화면에서는 칸 색으로 기록 상태(대기 · 작성 중 · 작성 완료)를 보였습니다. 최종 기록 상태(자료 기준): ' + [1, 2].map(function (r) { var saved = TABLES.filter(function (t) { return recStatus(t, r) !== 'wait'; }).length, done = TABLES.filter(function (t) { return recStatus(t, r) === 'done'; }).length; return r + '라운드 기록 ' + saved + '/' + TABLES.length + ' · 작성 완료 ' + done + '/' + TABLES.length; }).join(' · ') + '</p>';
  h += '<div class="avoid"><h3 class="h">' + esc(f.title || '경기도 중장년, 지금') + '</h3>' + (f.lead ? '<p style="margin:0 0 4px;font-size:11pt">' + esc(f.lead) + '</p>' : '') +
    '<div class="fgrid">' + (f.items || []).map(function (x) { return '<div class="fcell"><div class="fv">' + esc(x.v) + '</div><div class="fk">' + esc(x.k) + '</div>' + (x.s ? '<div class="fs">' + esc(x.s) + '</div>' : '') + '</div>'; }).join('') + '</div>' + (f.foot ? '<p class="ffoot">' + esc(f.foot) + '</p>' : '') + '</div>';
  if (T.length) h += '<div class="avoid"><h3 class="h">' + esc(src) + '<small>카드 ' + T.length + '장 · 팩트만</small></h3><div class="tgrid">' + T.map(function (it, i) { return '<div class="tcard a' + ((i % 4) + 1) + '"><span class="tn">' + pad(i + 1) + '</span><div class="tw">' + esc(it.k) + '</div>' + (it.s ? '<div class="ts">' + esc(it.s) + '</div>' : '') + (it.m ? '<div class="tm">' + esc(it.m) + '</div>' : '') + '</div>'; }).join('') + '</div><p class="src">출처 · ' + esc(src) + '</p></div>';
  h += '<div class="note avoid"><div class="row"><span class="k">휴식 · 취합</span><span>' + esc(phTime('collect')) + ' — 「토론 결과 종합 중」 화면에 ' + esc(f.title || '경기도 중장년, 지금') + ' 수치 표와 ' + esc(src) + ' 카드가 번갈아 떴습니다. 참가자 과업 없음, 잠시 쉬어 가세요</span></div></div>';
  return h + '</section>';
}

/* ---- 오늘의 한줄 요약 ---- */
function onelineHTML() {
  var o = onelineSummary(); var g = o.goal; var sumN = o.groups.reduce(function (s, x) { return s + x.n; }, 0);
  var h = '<section class="pg" id="s6">' + secHead(6, '결과공유 · ' + phTime('share'), '오늘의 한줄 요약', '', '「' + esc(PROMPT) + '」 · 여러분이 적은 ' + g.lines + '개를 같은 뜻끼리 묶었습니다' + (o.analyzed ? '' : ' (분석 전 · 화면 규칙으로 묶음)'));
  h += '<div class="kpi"><div><b>' + g.lines + '</b><span>한 줄</span></div><div><b>' + o.groups.length + '</b><span>묶음</span></div><div><b>' + g.writers + '명</b><span>참여' + (g.expected ? ' / ' + g.expected + '명' : '') + '</span></div><div><b>' + (o.groups[0] ? o.groups[0].pct + '%' : '-') + '</b><span>가장 많은 묶음 · ' + (o.groups[0] ? esc(o.groups[0].name) : '') + '</span></div></div>';
  h += '<div class="stack">' + o.groups.map(function (x, i) { var c = PG[i % PG.length]; return '<i class="' + (onColor(c) === '#fff' ? 'dk' : '') + '" style="flex:' + x.n + ';background:' + c + '">' + (x.pct >= 9 ? x.pct + '%' : '') + '</i>'; }).join('') + '</div>';
  h += '<table class="tb"><thead><tr><th></th><th>묶음</th><th>건</th><th>비율</th><th>요약 · 대표 글</th></tr></thead><tbody>' + o.groups.map(function (x, i) { var c = PG[i % PG.length]; var rep = (x.rep && x.rep.length ? x.rep.slice(0, 2).map(function (j) { return x.examples[j]; }) : x.examples.slice(0, 2)).filter(Boolean); return '<tr class="grp-row"><td class="c"><i style="background:' + c + '"></i></td><td class="nm"><b>' + esc(x.name) + '</b></td><td class="p">' + x.n + '</td><td class="p">' + x.pct + '%</td><td>' + (x.sum ? esc(x.sum) + ' ' : '') + (rep.length ? '<em>“' + rep.map(esc).join('” · “') + '”</em>' : '') + '</td></tr>'; }).join('') + '</tbody></table>';
  if (sumN !== g.lines) h += '<p class="fn">묶음 건수는 분석이 매긴 값(합계 ' + sumN + ')으로 전체 ' + g.lines + '건과 다를 수 있습니다. 비율은 묶음 합계 기준이며, 스크린에 보인 숫자와 같습니다.</p>';
  if (o.kw.length) { var kw = o.kw.slice(0, 6); var kmax = kw.reduce(function (m, k) { return Math.max(m, Number(k.n) || 0); }, 1); h += '<div class="avoid"><h3 class="h">자주 나온 말<small>' + kw.length + '개 · 스크린 요약 장과 같은 순서</small></h3><div class="kwbars">' + kw.map(function (k) { return '<div><b>' + esc(k.word) + '</b><i style="width:' + (Number(k.n) ? Math.round(100 * Number(k.n) / kmax) : 30) + '%"></i><span>' + (Number(k.n) || '') + '</span></div>'; }).join('') + '</div></div>'; }
  h += '<div class="say avoid">' + esc(o.say) + '</div>';
  return h + '</section>';
}

/* ---- 묶음 상세 ---- */
function groupsHTML() {
  var o = onelineSummary();
  var h = '<section class="pg" id="s7">' + secHead(7, '결과공유 · 오늘의 한줄 묶음', '한줄 묶음 ' + o.groups.length + '개', '', '묶음마다 요약 한 문장과 예시 글(최대 6개). 그 묶음을 가장 잘 보여 주는 글은 「대표 의견」으로 표시했습니다.');
  h += o.groups.map(function (g, i) { var c = PG[i % PG.length]; var ex = (g.examples || []).slice(0, 6); var rest = Math.max(0, g.n - ex.length); var rep = g.rep || [];
    return '<div class="og avoid" style="--gc:' + c + '"><div class="hd"><span class="chip" style="background:' + c + ';border-color:' + c + ';color:' + onColor(c) + '">' + (i + 1) + ' / ' + o.groups.length + ' · ' + esc(g.name) + '</span><span class="pct">' + g.pct + '%<small>' + g.n + '개</small></span></div>' +
      (g.sum ? '<p class="sum">' + esc(g.sum) + '</p>' : '') +
      ex.map(function (t, j) { var isRep = rep.indexOf(j) >= 0; return '<div class="item' + (isRep ? ' rep' : '') + '">' + esc(t) + (isRep ? '<i class="rtag">대표 의견</i>' : '') + '</div>'; }).join('') +
      (rest ? '<div class="rest">이 밖에 ' + rest + '개의 글이 같은 묶음에 있습니다</div>' : '') + '</div>'; }).join('');
  return h + '</section>';
}

/* ---- 테이블 정리 (테이블마다 한 쪽) ---- */
function tablesHTML() {
  var a = S.analysis;
  var h = '<section class="pg" id="s8">' + secHead(8, '결과공유 · 퍼실리테이터 발표', '테이블별 정리', '', '테이블마다 기록자가 적은 1·2라운드 기록을 정리한 것입니다 — 한 문장 · 핵심(테이블의 서로 다른 이야기, 최대 6가지) · 경기도에 바라는 것 · 자주 나온 말. 아래에 그 테이블에 앉은 분들을 적었습니다. 기록 원문은 9절에 있습니다.' + (a ? '' : ' (분석 전 — 기록 앞부분을 그대로 보입니다)'));
  h += TABLES.map(function (t) { var tp = tpOf(t), x = tableAnalysis(t); var head = '<div class="hd"><span class="tno">테이블 ' + t + '</span><span class="chip t' + tp.id + '">주제 ' + tp.id + ' · ' + esc(tp.sub) + '</span><span class="hall">' + kq(tp.title) + ' · ' + esc(HALL[t]) + '</span></div>';
    var seat = '<div class="seat">' + [1, 2].map(function (r) { var ns = rosterOf(t, r); return '<div><b>' + r + '라운드</b>' + (ns.length ? esc(ns.join(' · ')) + ' <span style="color:var(--muted)">(' + ns.length + '명)</span>' : '<span style="color:var(--muted)">명단 없음</span>') + '</div>'; }).join('') + '</div>';
    if (!x) { var rr = rec(t, 2).note ? 2 : 1; var note = rec(t, rr).note; return '<div class="tbl t' + tp.id + '">' + head + '<p class="pre">' + (note ? esc(note.slice(0, 600)) + (note.length > 600 ? ' …' : '') : '아직 기록이 없습니다') + '</p>' + seat + '</div>'; }
    var pts = (x.points || []).filter(Boolean).slice(0, 6); var kws = tableKeywords(t);
    return '<div class="tbl t' + tp.id + '">' + head + '<div class="body"><div><p class="one">' + (esc(x.one) || '(한 문장 없음)') + '</p>' + (pts.length ? '<ol class="pts">' + pts.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol>' : '') +
      '<div class="wish"><b>경기도에 바라는 것</b><p>' + (esc(x.wish) || '—') + '</p></div></div>' +
      (kws.length ? '<aside class="kw"><b>자주 나온 말</b>' + kws.map(function (k, i) { return '<span class="k' + (i + 1) + '">' + esc(k) + '</span>'; }).join('') + '</aside>' : '<div></div>') + '</div>' + seat + '</div>'; }).join('');
  return h + '</section>';
}

/* ---- 테이블별 기록 원문 (기록자가 적은 글 그대로) ---- */
function recordsHTML() {
  var tot = 0; TABLES.forEach(function (t) { [1, 2].forEach(function (r) { tot += rec(t, r).note.length; }); });
  var h = '<section class="pg" id="s9">' + secHead(9, '결과공유 · 기록자 기록', '테이블별 기록 원문 <small>9테이블 × 2라운드 · ' + tot.toLocaleString('ko-KR') + '자</small>', '', '기록자가 토론 중에 적은 글 그대로입니다(맞춤법·줄바꿈 포함). 8절의 정리는 이 기록을 바탕으로 만들었습니다. 「경기도에 바라는 것」은 기록자가 따로 적은 칸입니다.');
  h += TABLES.map(function (t) { var tp = tpOf(t);
    return '<div class="rec-tbl"><div class="hd"><span class="tno">테이블 ' + t + '</span><span class="chip t' + tp.id + '">주제 ' + tp.id + ' · ' + esc(tp.sub) + '</span><span class="hall">' + kq(tp.title) + ' · ' + esc(HALL[t]) + '</span></div>' +
      [1, 2].map(function (r) { var x = rec(t, r); var at = hm(x.updatedAt); var note = x.note.trim(), wish = x.wish.trim();
        return '<div class="rec-r"><h4>' + r + '라운드 기록<small>' + (note ? note.length.toLocaleString('ko-KR') + '자' : '기록 없음') + (at ? ' · 마지막 저장 ' + at : '') + '</small></h4>' +
          (note ? '<p class="rec-note">' + esc(note) + '</p>' : '<p class="src">(기록 없음)</p>') +
          (wish ? '<div class="rec-wish"><b>경기도에 바라는 것</b><p>' + esc(wish) + '</p></div>' : '') + '</div>'; }).join('') + '</div>'; }).join('');
  return h + '</section>';
}

/* ---- 포럼의 키워드 (낱말 구름 → 비중순 정렬) ---- */
function cloudHTML() {
  var out = [], seen = {}; var o = onelineSummary();
  function add(text, w, color, kind) { var t = String(text || '').trim(); if (t.length < 2) return; var k = t.replace(/\s+/g, ''); if (seen[k]) { if (w > seen[k].w) seen[k].w = w; return; } var x = { t: t, w: w, c: color, k: kind }; seen[k] = x; out.push(x); }
  o.groups.forEach(function (g, i) { add(g.name, i < 3 ? 5 : 4.4, PG[i % PG.length], 'group'); });
  o.kw.slice(0, 8).forEach(function (k) { add(k.word, 2.2, '#5F6979', 'line'); });
  TOPICS.forEach(function (tp) { var ta = topicAnalysis(tp.id); ((ta && ta.kw) || []).forEach(function (k, i) { add(k, i < 2 ? 3.4 : 2.7, TC[tp.id], 'topic t' + tp.id); }); });
  TABLES.forEach(function (t) { var tp = tpOf(t); tableKeywords(t).forEach(function (k, i) { add(k, i === 0 ? 3.1 : i === 1 ? 2.5 : 1.9, TC[tp.id], 'table t' + tp.id); }); });
  out.sort(function (a, b) { return b.w - a.w || a.t.localeCompare(b.t, 'ko'); });
  return '<section class="pg" id="s10"><div class="cloud"><div class="cl-t">경기도 중장년 네트워크 포럼의 키워드</div><div class="cl-s">오늘의 한줄 · 9개 테이블 토론에서 나온 말 ' + out.length + '개 · 스크린의 낱말 구름을 인쇄용으로 비중순 정렬했습니다</div>' +
    '<div>' + out.map(function (x) { return '<span class="cw ' + x.k + '" style="--cc:' + x.c + ';--on:' + onColor(x.c) + ';font-size:' + (7 + x.w * 1.8).toFixed(1) + 'pt">' + esc(x.t) + '</span>'; }).join('') + '</div>' +
    '<div class="lg"><span><i style="background:#0E4194"></i>채운 칩 = 오늘의 한줄 묶음</span>' + TOPICS.map(function (tp) { return '<span><i style="background:' + TC[tp.id] + '"></i>주제 ' + tp.id + ' ' + esc(tp.sub) + ' (주제·테이블 핵심어)</span>'; }).join('') + '<span><i style="background:#B7C0CF"></i>오늘의 한줄 자주 나온 말</span></div></div></section>';
}

/* ---- 마무리 ---- */
function endHTML() {
  var pho = program().photo || {}; var a = S.analysis || {}; var anaAt = hm(st().analyzedAt) || hm(a.at);
  return '<section class="pg" id="s11"><div class="ending"><div class="ht">' + esc(pho.title || EVENT.name) + '</div><div class="hs">' + esc(pho.sub || '경기 중장년, 경험을 잇고 내일을 묻다') + '</div><div class="thanks">고맙습니다</div>' +
    '<p class="fin">' + esc(EVENT.date) + ' · ' + esc(EVENT.place) + '<br>이 자료집은 당일 스크린에 표출된 내용을 글로 옮기고 테이블별 기록 원문을 붙인 것입니다. 주제별 종합·건의사항 종합은 운영진 보고서에 따로 정리됩니다.</p>' +
    '<p class="pub">' + (anaAt ? '분석 ' + esc(EVENT.date) + ' ' + anaAt + (a.engine ? ' (' + esc(a.engine) + ')' : '') + ' · ' : '') + '자료 개정 ' + (S.rev || 0) + ' · 자료집 생성 ' + esc(new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })) + '</p></div></section>';
}

function renderAll() {
  var parts = [coverHTML(), tocHTML(), linesHTML(), part1HTML(), part2HTML(), rosterHTML(1, true), rosterHTML(2, false), indexHTML(), liveHTML(), onelineHTML(), groupsHTML(), tablesHTML(), recordsHTML(), cloudHTML(), endHTML()];
  document.getElementById('doc').innerHTML = parts.join('');
  document.title = '스크린 자료집 · ' + EVENT.name;
  document.body.setAttribute('data-ready', '1');
}
function setZoom(z) { document.getElementById('doc').style.zoom = z; document.querySelectorAll('#zoom button').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.z) === Number(z)); }); try { localStorage.setItem('gwb-digest-zoom', String(z)); } catch (e) {} }
function boot() {
  var links = document.getElementById('tbLinks');
  if (CFG.site) links.innerHTML = '<a class="btn ghost" href="' + esc(String(CFG.site).replace(/\/+$/, '') + '/digest.pdf') + '" target="_blank">PDF 내려받기</a>';   // 행사 뒤 만들어 올린 완성본 (Vercel)
  document.getElementById('btnPrint').onclick = function () { window.print(); };
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'p') { e.preventDefault(); window.print(); } });   // Apps Script 바깥 틀이 아니라 이 문서를 인쇄 (#20)
  document.querySelectorAll('#zoom button').forEach(function (b) { b.onclick = function () { setZoom(b.dataset.z); }; });
  var z = 1; try { z = Number(localStorage.getItem('gwb-digest-zoom')) || 1; } catch (e) {} setZoom(z);
  function go(snap) { S = snap; var fin = function () { try { renderAll(); } catch (e) { console.error(e); document.getElementById('doc').innerHTML = '<div class="err">자료를 그리는 중 오류: ' + esc(e.message || e) + '</div>'; } };
    if (document.fonts && document.fonts.ready) { var done = false; var once = function () { if (!done) { done = true; fin(); } }; document.fonts.ready.then(once, once); setTimeout(once, 2500); } else fin(); }
  if (window.DIGEST_SNAP) { go(window.DIGEST_SNAP); return; }   // 정적 PDF 빌드: 스냅샷을 파일에 심어 둔 경우
  API.call('getSnapshot', [0], function (snap) { if (!snap || !snap.state) { document.getElementById('doc').innerHTML = '<div class="err">자료를 받지 못했습니다. 잠시 뒤 새로 고쳐 주세요.</div>'; return; } go(snap); },
    function (e) { document.getElementById('doc').innerHTML = '<div class="err">자료를 받지 못했습니다: ' + esc((e && e.message) || e) + '<br>잠시 뒤 새로 고쳐 주세요.</div>'; });
}
boot();
</script>
</body>
</html>
