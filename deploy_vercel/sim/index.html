nYes; document.getElementById('askMsg').textContent = msg; document.getElementById('ask').className = 'ask on'; setTimeout(function () { document.getElementById('askYes').focus(); }, 30); }\nfunction askClose(yes) { var cb = askCb; askCb = null; document.getElementById('ask').className = 'ask'; if (yes && cb) cb(); }\ndocument.getElementById('askYes').onclick = function () { askClose(true); };\ndocument.getElementById('askNo').onclick = function () { askClose(false); };\ndocument.getElementById('ask').onclick = function (e) { if (e.target === this) askClose(false); };\ndocument.addEventListener('keydown', function (e) { if (e.key === 'Escape' && askCb) askClose(false); });\nfunction toast(msg, err) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); setTimeout(function () { t.className = 'toast'; }, err ? 3200 : 2200); }\nfunction admin(fn, args, cb, eb) { API.call(fn, [PIN].concat(args || []), function (r) { forceRefresh(); if (cb) cb(r); }, function (e) { forceRefresh(); revertOptimistic(); toast('실패: ' + (e && e.message ? e.message : e), true); if (eb) eb(e); }); }   // 실패해도 다음 폴링에서 서버 상태로 되돌린다 (v3.10)\nfunction revertOptimistic() { optimistic = null; if (BC) { try { BC.postMessage({ type: 'revert' }); } catch (e0) {} } }   // 같은 브라우저의 스크린·미리보기도 바로 서버 상태로\n/* 상태 변경 (v3.10): 서버 응답을 기다리지 않고 예상 상태를 바로 그리고, 같은 브라우저의 스크린 창·미리보기에도 바로 알린다(BroadcastChannel). 서버 응답이 오면 그것으로 맞춘다 */\nvar optimistic = null, holdPending = false;   // 방금 보낸 변경의 예상 상태 — 폴링으로 온 더 오래된 스냅샷이 이를 덮지 않게 · holdPending: 「화면 멈춤」 두 번 누름 방지\nfunction reconcileSnap(snap) { if (optimistic && snap && snap.state) { var su = Number(snap.state.updatedAt) || 0, so = snap.state.op, oo = optimistic.state.op; var older = (so && oo) ? (so !== oo && su < optimistic.at + 3000) : (su < optimistic.at - 3000); if (older) snap.state = optimistic.state; else optimistic = null; } return snap; }\nfunction setState(patch, msg) {\n  patch = patch || {}; patch.op = 'o' + Math.random().toString(36).slice(2, 10);   // 변경 꼬리표: 서버 상태가 이 변경을 담았는지 알아보는 데 씀\n  var pred = predictState(st(), patch); optimistic = { state: pred, at: nowServer() };\n  if (BC) { try { BC.postMessage({ type: 'state', state: pred, at: optimistic.at }); } catch (e0) {} }\n  S.state = pred; render();\n  lastOp = patch.op;\n  admin('adminSetState', [patch], function (r) {\n    if (r && r.ok === false) { if (patch.op === lastOp) revertOptimistic(); toast('실패: ' + (r.error || ''), true); render(); return; }\n    if (patch.op !== lastOp) return;   // 그 사이 더 새 클릭을 보냈으면 이 (오래된) 응답으로 되돌리지 않는다 — 연타 때 N+2 → N+1 → N+2 깜빡임 방지\n    if (r && r.state) { S.state = r.state; } optimistic = null; if (msg) toast(msg); render();\n  });\n}\nvar lastOp = '';   // 가장 최근에 보낸 변경의 꼬리표\n/* 프로그램 저장(공통): 이 탭이 다루지 않는 항목은 서버 값 그대로 보내고, 성공하면 편집본을 비워 서버 값으로 다시 그린다 */\nfunction saveProgramTo(p, btn, doneMsg, after) {\n  if (btn) btn.disabled = true;\n  admin('adminSetProgram', [p], function (r) { if (btn) btn.disabled = false; if (r && r.ok === false) { toast('저장 실패: ' + (r.error || ''), true); return; } if (r && r.program) S.program = r.program; if (after) after(); toast(doneMsg); render(); }, function () { if (btn) btn.disabled = false; });\n}\n\n/* ---- PIN 입구 ---- */\nfunction enter(pin) {\n  API.call('adminCheckPin', [pin], function (r) { PIN = pin; try { sessionStorage.setItem('gwb-pin', pin); } catch (e) {} hasKey = !!(r && r.hasKey); document.getElementById('gate').style.display = 'none'; startPolling(2000, function () { if (typing()) { pendingRender = true; return; } render(); }); },\n    function (e) { var m = (e && e.message) ? String(e.message) : ''; var fromServer = !!(e && e.remote) || /PIN/.test(m); document.getElementById('gateErr').textContent = fromServer ? m : '서버에 연결하지 못했습니다 · 인터넷을 확인한 뒤 다시 눌러 주세요'; });   // 서버 문구(틀림·잠김)와 통신 오류를 구분 (v3.12.1)\n}\ndocument.getElementById('gateForm').onsubmit = function (e) { e.preventDefault(); enter(document.getElementById('pin').value.trim()); };\nif (PIN) enter(PIN); else if (API.isLocal) enter('local');\n\n/* ---- 공통 헤더 ---- */\nfunction renderStatus() {\n  var s = st(); var g = lineGoal();\n  document.getElementById('status').innerHTML = '<span class=\"pill\">' + esc(phaseLabel()) + '</span>' + (s.hold ? '<span class=\"pill warn\">화면 멈춤</span>' : '') + '<span class=\"pill ' + (s.closed ? 'ok' : 'wait') + '\">' + (s.closed ? '입력 마감' : '입력 중') + '</span><span class=\"pill ' + (s.analyzed ? 'ok' : 'wait') + '\">' + (s.analyzed ? '분석 완료' : '분석 전') + '</span><span class=\"pill\">한줄 ' + g.lines + '개 · 작성 ' + g.writers + '명 · 완료 ' + g.doneWriters + (g.expected ? ' / ' + g.expected : '') + '명</span>' + (g.editing ? '<span class=\"pill warn\">수정 중 ' + g.editing + '명</span>' : '');\n  document.getElementById('livePill').textContent = API.isLocal ? '로컬 미리보기' : '실시간 · ' + nowHM();\n}\nfunction cueHTML() { return '<div class=\"cue\">' + PH.map(function (p) { return '<button data-ph=\"' + p[0] + '\" class=\"' + (phase() === p[0] ? 'on' : '') + '\"><b>' + p[2].split('~')[0] + '</b>' + p[1] + '</button>'; }).join('') + '</div>'; }\n/* 단계 이동: 휴식·취합으로 넘길 때만 마감 확인. 단계가 바뀌면 장표는 첫 장(slide 0), 「이전」으로 거슬러 갈 때는 그 단계의 마지막 장 */\nfunction goPhase(ph, slide) {\n  var go = function () { setState({ phase: ph, slide: slide === undefined ? 0 : slide }, phName(ph) + ' 단계로 바꿨습니다'); };\n  if (ph === 'collect' && !st().closed) ask('휴식·취합 단계로 넘기면 기록 입력이 마감됩니다. 계속할까요?', go); else go();\n}\nfunction wireCue(root) { root.querySelectorAll('.cue button').forEach(function (b) { b.onclick = function () { goPhase(b.dataset.ph, 0); }; }); }\n\n/* ---- 진행·스크린 제어 ---- */\n/* 콘솔 「오프닝 영상」 상태 줄: 스크린이 알려 온 파일, 또는 프로그램의 영상 주소 */\nfunction videoStatusText() {\n  var sc = S.screen, pv = program().video || {};\n  if (sc && sc.video) return '스크린에 파일 준비됨 · ' + sc.video.name + (sc.video.dur ? ' · ' + Math.floor(sc.video.dur / 60) + '분 ' + (sc.video.dur % 60) + '초' : '');\n  if (pv.url) return (/\\.(mp4|webm)/i.test(pv.url) ? 'mp4 주소 영상 · ' : 'YouTube · 드라이브 영상(자동 재생, 콘솔 제어 불가) · ') + pv.url.slice(0, 50);\n  return '영상 없음 — 스크린 노트북에서 V 키로 파일 선택, 또는 「프로그램」 탭에 mp4 주소';\n}\nfunction liveOf() { var lv = program().live || {}; return { panels: (lv.panels || []).slice(), sec: Number(lv.sec) || 20, pin: lv.pin || '' }; }\nfunction readLive(v) { var panels = []; v.querySelectorAll('.lvPanel').forEach(function (c) { if (c.checked) panels.push(c.value); }); var sec = Math.max(5, Math.min(120, Number(v.querySelector('#lvSec').value) || 20)); var pe = v.querySelector('[name=lvPin]:checked'); return { panels: panels, sec: sec, pin: pe ? pe.value : '' }; }\nfunction readCloud(v) { var s = v.querySelector('#clStyle'), f = v.querySelector('#clFrame'); return { style: s ? s.value : 'a', frame: f ? f.value : 'word' }; }   // 「포럼의 키워드」 보기·테두리 (v3.11)\nfunction saveLive() {\n  var v = document.getElementById('view-control'); var lv = readLive(v);\n  if (!lv.panels.length && !lv.pin) { toast('순환할 패널을 하나 이상 고르거나 고정 패널을 정하세요', true); return; }\n  var p = copyJ(program()); p.live = lv; p.cloud = readCloud(v);\n  saveProgramTo(p, v.querySelector('#saveLive'), '저장됨 · 스크린에 2초 안에 반영', function () { LV = null; });\n}\nfunction renderControl() {\n  var v = document.getElementById('view-control'); var s = st(); var ph = phase(); var pi = phIndex(ph); var deck = deckFor(ph) || []; var idx = Math.max(0, Math.min(Number(s.slide) || 0, deck.length - 1)); var cur = curSlide() || deck[idx] || {}; var rs = roundState(); var g = lineGoal(); var lv = LV || liveOf(); var inRound = ph === 'r1' || ph === 'r2';\n  var atFirst = idx <= 0 && pi === 0, atLast = idx >= deck.length - 1 && pi >= PH.length - 1;\n  var nextTxt = idx < deck.length - 1 ? slideLabel(deck[idx + 1]) : (pi < PH.length - 1 ? '「' + PH[pi + 1][1] + '」 ' + slideLabel((deckFor(PH[pi + 1][0]) || [])[0] || {}) : '마지막 장입니다');\n  var ta = cur.type === 'table' ? tableAnalysis(cur.t) : null;\n  /* 미리보기 iframe 이 든 뼈대는 처음 한 번만 만든다. 그 뒤로는 바뀌는 칸만 다시 그려 iframe 이 다시 뜨지 않게 한다(스크린의 순환·끼어들기 상태가 미리보기에 그대로 보임) (v3.8. --lime-b)}\n.brkb-art{position:relative;align-self:stretch;min-height:0}\n.brkb-hero{position:absolute;inset:0;width:100%;height:100%;overflow:visible}\n.brkb-steam path{transform-box:fill-box;transform-origin:50% 100%;animation:brkb-steam 6s ease-in-out infinite}\n.brkb-steam .st1{animation-delay:calc(var(--t0,0s) - 0s)}.brkb-steam .st2{animation-delay:calc(var(--t0,0s) - 2s)}.brkb-steam .st3{animation-delay:calc(var(--t0,0s) - 4s)}\n@keyframes brkb-steam{0%,100%{transform:translateY(0) scaleY(1);opacity:.75}50%{transform:translateY(-3%) scaleY(1.07);opacity:1}}\n@media (prefers-reduced-motion: reduce){.brkb-steam path{animation:none}}\n/* 기념촬영 — 사진 배경이므로 글자만 */\n.photo-t{flex:none;font-size:calc(clamp(52px,7vw,116px) * var(--fit,1));font-weight:700;letter-spacing:-.03em;color:#fff;text-align:center;line-height:1.15;white-space:nowrap;max-width:100%;align-self:center}   /* 한 줄 (v3.8) */\n.photo-s{flex:none;font-size:clamp(28px,3.4vw,50px);font-weight:700;text-align:center;margin-top:.4em;letter-spacing:-.01em}\n.photo-s span{display:inline-block;background:linear-gradient(90deg,var(--lime-b) 0%,var(--green-b) 50%,var(--teal-b) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .1em}   /* 「경기 중장년, 경험을 잇고 내일을 묻다」 슬로건 색 (v3.8) */\n/* 인사말·축사 — 한 장에 한 명: 위에 소속(크게), 아래에 이름(더 크게). 인사말은 청록, 축사는 주황 계열로 구분 */\n.gone{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(14px,2.8vh,40px);--ac:var(--teal-b)}\n.gone.cong{--ac:var(--orange-b)}\n.gone .gk{font-size:clamp(26px,4.2vh,54px);font-weight:700;letter-spacing:.14em;color:var(--ac);border:2px solid var(--ac);border-radius:.4em;padding:.15em .9em}\n.gone .go{font-size:clamp(46px,7.6vh,112px);font-weight:700;color:#fff;line-height:1.25;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all;max-width:92%}\n.gone .gn{font-size:clamp(104px,21vh,280px);font-weight:700;line-height:1.1;letter-spacing:-.03em;color:var(--ac)}\n.gone .gn .none{color:var(--mut-2);font-weight:400;font-size:.45em}\n.gone .go.none{color:var(--mut-2);font-weight:400}\n/* 영상 */\n.vid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px)}\n.vid .s-title{flex:none}\n.vwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}\n.vbox{position:relative;background:var(--gg-d);border-radius:8px;overflow:hidden;width:100%;height:100%}\n.vbox iframe,.vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--gg-d)}\n.vhint{flex:none;font-size:clamp(12px,1.6vh,16px);color:var(--mut-2)}\n.vbox video{object-fit:contain}\n.vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(20px,3vh,36px);background:rgba(7,36,72,.35);cursor:pointer}\n/* 토론 주제 4개 */\n.tp4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(10px,1.4vw,22px)}\n/* 토론 주제 카드: 꼬리표(주제 N · 영역) → 제목(크게) → 부제 → 테이블 번호. 설명(긴 질문)은 v3.9.5 에서 삭제. 넘치면 --fit 으로 축소 */\n.tpc{--fit:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:clamp(8px,1.6vh,20px);min-height:0;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.08);border-top:clamp(6px,1vh,12px) solid var(--rc);padding:clamp(14px,2.4vh,36px) clamp(18px,2.2vw,44px)}\n.tpc .k{font-size:calc(clamp(18px,2.7vh,32px) * var(--fit));font-weight:700;letter-spacing:.02em;background:var(--rc);color:var(--gg-d);border-radius:.35em;padding:.1em .65em;line-height:1.35}\n.tpc.t4 .k{color:#fff}\n.tpc h3{margin:0;font-size:calc(clamp(32px,5.8vh,68px) * var(--fit));line-height:1.2;letter-spacing:-.025em;color:#fff;text-wrap:balance}\n.tpc .sub{font-size:calc(clamp(22px,3.5vh,42px) * var(--fit));line-height:1.35;color:#D7E3F7;text-wrap:balance}\n.tpc .nw{white-space:nowrap}\n.tpc .tb{flex:none;margin-top:clamp(2px,.6vh,10px);font-size:calc(clamp(17px,2.4vh,28px) * var(--fit));color:var(--rc-b);font-weight:700}\n/* 주제 색: --rc 는 원색(띠·바탕), --rc-b 는 어두운 바탕 위 글자용 밝은 변형 */\n.t1{--rc:var(--hc-teal);--rc-b:var(--teal-b)}.t2{--rc:var(--hc-lime);--rc-b:var(--lime-b)}.t3{--rc:var(--hc-orange);--rc-b:var(--orange-b)}.t4{--rc:var(--hc-deep);--rc-b:var(--orange-b)}\n/* 9칸 격자(지도·명단·현황) */\n.g9{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(8px,1.2vw,18px)}\n.c9{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-left:clamp(5px,.7vh,10px) solid var(--rc);padding:clamp(8px,1.3vh,18px) clamp(10px,1.2vw,22px)}\n.c9 .ch{flex:none;display:flex;align-items:baseline;gap:.5em;margin-bottom:clamp(5px,.9vh,12px);padding-bottom:clamp(4px,.7vh,10px);border-bottom:1px solid rgba(255,255,255,.2);white-space:nowrap;overflow:hidden}\n.c9 .no{font-size:clamp(26px,4vh,52px);font-weight:700;color:var(--rc-b);line-height:1;font-variant-numeric:tabular-nums}\n.c9 .hall{font-size:clamp(16px,2.2vh,26px);color:#fff;font-weight:600}\n.c9 .tp{margin-left:auto;font-size:clamp(18px,2.4vh,26px);color:var(--mut-2);overflow:hidden;text-overflow:ellipsis}\n.names{flex:1;min-height:0;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.1em .75em;font-size:calc(clamp(18px,3vh,38px) * var(--fit,1));font-weight:600;color:#fff;line-height:1.4;word-break:keep-all}\n.names.none{color:var(--mut-2);font-weight:400;font-size:clamp(16px,2.4vh,26px)}\n/* 칸 = 왼쪽(번호 · 상태 · 홀) | 오른쪽(주제 꼬리표 · 주제명). 칸 전체 색이 상태: 대기 흰색 · 작성 중 노란색 · 작성 완료 = 주제 색으로 가득 (v3.9.2) */\n.sc{--fit:1;--ink:var(--gg-d);display:grid;grid-template-columns:minmax(0,25%) minmax(0,1fr);min-height:0;overflow:hidden;border-radius:10px;border-top:clamp(6px,1vh,12px) solid var(--rc);background:#FFFFFF;color:var(--ink);transition:background .35s,border-color .35s,color .35s}\n.sc.draft{background:#FFD84D}\n.sc.done{background:var(--rc)}\n.sc .side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;padding:clamp(6px,1vh,14px) clamp(6px,.6vw,12px);border-right:2px solid rgba(7,36,72,.12);background:rgba(7,36,72,.05)}\n.sc .no{font-size:calc(clamp(40px,7.8vh,104px) * var(--fit));font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}\n.sc .lb{font-size:calc(clamp(15px,2.4vh,30px) * var(--fit));font-weight:700;white-space:nowrap;padding:.08em .55em;border-radius:.35em}\n.sc.wait .lb{color:#5F6979;background:#EEF2F8}\n.sc.draft .lb{color:#5C3D00;background:rgba(255,255,255,.6)}\n.sc.done .lb{color:#fff;background:var(--gg-d)}\n.sc .main{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:.45em;padding:clamp(8px,1.3vh,18px) clamp(12px,1.3vw,24px);text-align:left}\n.sc .cat{font-size:calc(clamp(15px,2.2vh,26px) * var(--fit));font-weight:700;line-height:1.3;background:var(--rc);color:var(--gg-d);border-radius:.35em;padding:.1em .6em}\n.sc.t4 .cat{color:#fff}\n.sc.done .cat{background:rgba(7,36,72,.85);color:#fff}   /* 칸이 주제 색이 되면 꼬리표는 남색으로 */\n.sc .tt{font-size:calc(clamp(22px,3.7vh,48px) * var(--fit));font-weight:700;line-height:1.22;letter-spacing:-.01em;text-wrap:balance}\n.sc .ln{font-size:calc(clamp(12px,1.7vh,20px) * var(--fit));color:rgba(7,36,72,.68);white-space:nowrap;margin-top:.2em}\n.sc .nw{white-space:nowrap}\n.lg{font-style:normal;display:inline-block;margin-left:8px;padding:1px 10px;border-radius:.4em;font-size:clamp(18px,2.4vh,26px);font-weight:700;border:1px solid transparent}\n.sc.fresh{outline:6px solid #fff;outline-offset:-6px;box-shadow:0 0 0 4px var(--yellow-b),0 0 28px rgba(255,222,77,.7)}   /* 방금 작성 완료된 테이블: 6초 동안 흰 테두리 + 노란 빛 */\n.sc.new{animation:donepop 1.2s ease-out}   /* 그중 처음 1.3초만 한 번 튀어오름 */\n@keyframes donepop{0%{transform:scale(.92);box-shadow:0 0 0 0 rgba(255,222,77,.9)}60%{transform:scale(1.03);box-shadow:0 0 0 14px rgba(255,222,77,0)}100%{transform:none;box-shadow:none}}\n.lg.wait{background:#FFFFFF;color:var(--gg-d)}.lg.draft{background:#FFD84D;color:var(--gg-d)}.lg.done{background:linear-gradient(90deg,var(--hc-teal),var(--hc-lime) 50%,var(--hc-orange));color:var(--gg-d)}   /* 범례: 흰색 · 노란색 · 주제 색 */\n/* 패널 제목 줄 */\n.pt{flex:none;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin-bottom:clamp(8px,1.4vh,16px)}\n.pt b{font-size:clamp(26px,3.8vh,44px);color:var(--orange-b);letter-spacing:-.02em}\n.pt span{font-size:clamp(18px,2.4vh,28px);color:var(--mut)}\n.pt em{font-style:normal;color:#fff}\n/* 숫자 타일(경기도 중장년, 지금) */\n.fgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(8px,1.2vw,22px)}\n.fcell:last-child:nth-child(4n+3){grid-column:span 2}   /* 7개면 마지막 칸이 비지 않게 두 칸 차지 */\n.fcell{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;overflow:hidden;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);padding:clamp(6px,1.2vh,18px)}\n.fcell .fv{font-size:clamp(28px,6vh,84px);font-weight:700;line-height:1.05;letter-spacing:-.03em;color:var(--orange-b);white-space:nowrap;font-variant-numeric:tabular-nums}\n.fcell .fk{font-size:clamp(20px,3.2vh,36px);font-weight:600;color:#fff;margin-top:.4em;word-break:keep-all;line-height:1.3}\n.fcell .fs{font-size:clamp(17px,2.5vh,28px);color:var(--mut);margin-top:.25em;word-break:keep-all;line-height:1.35}\n.fgrid.compact .fv{font-size:clamp(24px,4.6vh,62px)}\n.fgrid.compact .fk{font-size:clamp(14px,2vh,26px)}\n.ffoot{flex:none;margin-top:clamp(8px,1.4vh,16px);font-size:clamp(18px,2.4vh,28px);color:var(--mut);text-align:center}\n/* 트렌드 카드(라운드 패널 · 휴식 화면) — 팩트만: 머리글(크게) · 번호 배지 · 키워드 · 설명 (· 한 줄 더). 가운데 정렬, 카드마다 강조색 (v3.8) */\n.trend{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(12px,2.4vh,32px);animation:fadein eturn out;\n}\nvar CATS = [['사람·연결', ['연락처', '사람', '모임', '연결', '네트워크', '만남', '친구', '동료', '대표', '같이']], ['정보·방법', ['정보', '방법', '힌트', '노하우', '사례', '자료', '팁', '배움', '어디서']], ['정책·경기도', ['경기도', '정책', '지원', '제도', '예산', '도청', '시군']], ['마음·용기', ['용기', '위로', '공감', '힘', '확인', '마음', '응원', '자신감', '혼자']]];\nfunction summaryStats() {\n  var L = visibleLines(); var freq = {};\n  L.forEach(function (o) { tokens(o.text).forEach(function (w) { freq[w] = (freq[w] || 0) + 1; }); });\n  var top = Object.keys(freq).map(function (w) { return [w, freq[w]]; }).sort(function (a, b) { return b[1] - a[1] || a[0].localeCompare(b[0]); }).slice(0, 12);\n  var cats = CATS.map(function (c) { return { name: c[0], keys: c[1], items: [] }; }); var other = { name: '그 밖에', keys: [], items: [] };\n  L.forEach(function (o) { var c = null; for (var i = 0; i < cats.length; i++) if (cats[i].keys.some(function (k) { return o.text.indexOf(k) >= 0; })) { c = cats[i]; break; } (c || other).items.push(o); });\n  var devs = new Set(L.map(function (o) { return o.dev; })).size;\n  var avg = L.length ? Math.round(L.reduce(function (n, o) { return n + o.text.length; }, 0) / L.length) : 0;\n  var buckets = {}; L.forEach(function (o) { var at = o.at || '00:00'; var h = at.slice(0, 2), m = +at.slice(3, 5); var b = h + ':' + pad(Math.floor(m / 5) * 5); buckets[b] = (buckets[b] || 0) + 1; });\n  return { n: L.length, devs: devs, avg: avg, top: top, cats: cats.concat([other]), buckets: Object.keys(buckets).sort().map(function (k) { return [k, buckets[k]]; }) };\n}\nfunction linesCSV() {\n  var rows = [['번호', '시간', '테이블', '내용', '상태']]; (S.lines || []).forEach(function (o, i) { rows.push([i + 1, o.at, o.table ? o.table + '번' : '', o.text, o.hidden ? '숨김' : '표시']); });\n  /* 엑셀에서 열 때 '=', '+', '-', '@' 로 시작하는 칸이 수식으로 실행되지 않게 작은따옴표를 앞에 붙인다 */\n  return '﻿' + rows.map(function (r) { return r.map(function (c) { var s = String(c); if (/^[=+\\-@\\t\\r]/.test(s)) s = \"'\" + s; return '\"' + s.replace(/\"/g, '\"\"') + '\"'; }).join(','); }).join('\\r\\n');\n}\n\n/* ================= 로컬 미리보기용 MOCK 서버 (같은 브라우저의 localStorage) =================\n   Apps Script 밖(파일로 직접 열었을 때)에서만 쓰인다. 서버 함수와 같은 이름·반환 형식.\n   콘솔에서 예시 데이터: API.call('mockFillDemo', [], function (r) { console.log(r); }) */\nvar MOCK = (function () {\n  var KEY = 'gwb-gs-mock-v3';   // v2 데이터('gwb-gs-mock')와 분리\n  function emptyRecords() { var rc = {}; TABLES.forEach(function (t) { rc[t] = { 1: { note: '', wish: '', updatedAt: '', done: false }, 2: { note: '', wish: '', updatedAt: '', done: false } }; }); return rc; }\n  function emptyState() { return { phase: 'reg', round: 0, roundStart: 0, slide: 0, same: {}, closed: false, analyzed: false, analyzedAt: 0, forceWall: false, expected: 0, updatedAt: 0 }; }\n  function empty() { return { rev: 1, state: emptyState(), lines: [], records: emptyRecords(), program: mergeProgram(null), analysis: null }; }\n  function load() { try { var j = localStorage.getItem(KEY); if (j) { var d = JSON.parse(j); if (!d.records) d.records = emptyRecords(); if (!d.program) d.program = mergeProgram(null); return d; } } catch (e) {} var n = empty(); save(n); return n; }\n  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }\n  function bump(d) { d.rev = (d.rev || 0) + 1; save(d); }\n  function fail(msg) { return { ok: false, error: msg }; }\n  function isInt(n, lo, hi) { return typeof n === 'number' && isFinite(n) && Math.floor(n) === n && n >= lo && n <= hi; }\n  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }\n  /* ---- 규칙 기반 정리 (Code.gs 의 sentences_ · cut_ · tableRule_ 과 같은 규칙) ---- */\n  function sentences(s) { var m = String(s || '').replace(/\\r/g, '').match(/[^.!?\\n。]+[.!?。]?/g) || []; return m.map(function (x) { return x.trim(); }).filter(function (x) { return x.length >= 2; }); }\n  function cut(s, n) { s = String(s || '').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }\n  function recText(t) { var notes = [], wishes = []; 장이 그리는 앞 6개 안에서만\n  var k = Math.min(g.n <= 4 ? 1 : g.n <= 9 ? 2 : 3, ex.length);\n  var toks = ex.map(function (t) { var seen = {}; return tokens(t).filter(function (w) { if (seen[w]) return false; seen[w] = true; return true; }); });\n  var df = {}; toks.forEach(function (ts) { ts.forEach(function (w) { df[w] = (df[w] || 0) + 1; }); });\n  var sumT = {}; tokens(g.sum || '').forEach(function (w) { sumT[w] = true; }); var keys = (g.keys || []).map(String);\n  var sc = toks.map(function (ts, i) {\n    var s = 0; ts.forEach(function (w) { s += (df[w] - 1) + (sumT[w] ? 2 : 0) + (keys.some(function (kk) { return w.indexOf(kk) >= 0; }) ? 1.5 : 0); });\n    var lf = ts.length >= 3 ? 1 : ts.length === 2 ? 0.8 : 0.5;   // 한두 낱말짜리 글은 대표로 덜 뽑는다\n    return { i: i, s: (ts.length ? s / Math.sqrt(ts.length) : 0) * lf + Math.min(ts.length, 3) * 0.1 + (g.ai ? (ex.length - i) * 0.1 : 0) };   // 겹침이 없을 때는 낱말 셋 이상인 온전한 문장을 먼저 · AI 가 대표적인 것부터 준 순서는 조금만 반영\n  });\n  sc.sort(function (a, b) { return b.s - a.s || a.i - b.i; });\n  return sc.slice(0, k).map(function (x) { return x.i; }).sort(function (a, b) { return a - b; });\n}\n/* 오늘의 한줄 요약 자료: 분석 결과가 있으면 그것을, 없으면 화면 규칙으로 즉석 묶음 (그래프용 pct 포함) */\nvar GROUP_COLORS = ['#4FD8C8', '#CBE84F', '#FFB43F', '#FFDE4D', '#FF9250', '#57D07A', '#A8BFE2'];\nfunction onelineSummary() {\n  var g = lineGoal(); var a = (S.analysis && S.analysis.oneline) || null; var stt = summaryStats();\n  var ai = /^claude/i.test(String((S.analysis && S.analysis.engine) || ''));   // AI 분석이면 examples 순서가 대표적인 것부터\n  var groups = (a && a.groups && a.groups.length) ? a.groups.map(function (x) { return { name: x.name, n: Number(x.n) || 0, sum: x.sum || '', examples: x.examples || [], ai: ai }; })\n    : stt.cats.filter(function (c) { return c.items.length; }).map(function (c) { return { name: c.name, n: c.items.length, sum: '', examples: c.items.slice(0, 6).map(function (o) { return o.text; }), keys: c.keys }; });\n  groups.sort(function (x, y) { return y.n - x.n; });\n  groups.forEach(function (x) { x.rep = pickRep(x); });   // 대표 의견(대표 글의 번호 1~3개) (v3.8)\n  var total = groups.reduce(function (s, x) { return s + x.n; }, 0) || 1;\n  groups.forEach(function (x, i) { x.pct = Math.round(100 * x.n / total); x.color = GROUP_COLORS[i % GROUP_COLORS.length]; });\n  var kw = (a && a.kw && a.kw.length) ? a.kw.map(function (k) { return typeof k === 'string' ? { word: k, n: 0 } : k; }) : [];   // 분석 전에는 핵심어를 내지 않음\n  var say = (a && a.sum) ? a.sum : ('오늘의 한줄 ' + g.lines + '개가 모였습니다. 분석 실행 후 같은 뜻끼리 묶은 결과와 요약이 표시됩니다.');\n  return { goal: g, groups: groups, kw: kw, say: say, engine: a ? (S.analysis.engine || '') : '화면 규칙(분석 전)', analyzed: !!a, total: total };\n}\n\n/* ---- 오늘의 한줄 집계 (화면용 단순 규칙) ---- */\nvar STOP = new Set('오늘 여기서 여기 얻어 가고 싶은 하나 것 수 등 더 좀 그리고 그 저 우리 나 내 제 한 줄 있는 없는 대한 위한 위해 같은 정말 너무 조금 뭘 뭐 해 하는 있는지 건지 경우 부분 필요 생각 의견 내용 사람들 정도 이런 저런 그런 통해 대해 관련 때문 다른 다음 어디 어떻게 무엇 조금이라도 직접 실제로 함께 같이 다시 계속 꾸준히 이제 아직 그냥 정말로 조금씩 이야기 말 분 데 때 뒤 전 중 가장 바로 모두 모든 서로 이번 그동안 둘 셋 번째 처음 공통 중심 결론 제안 사례 이유 라운드 테이블 명 분들 분이 말이 것은 것이 것을 것도 했다 있었다 없었다 나왔다 됐다 된다 한다 이었다 였다 많았다 싶다 있다 없다 마무리 미리 먼저 자주 오래 거의 특히 이미 아마 또한 다만 역시 매우 아주 항상 자꾸 금방 우선 결국 과연 마치 더욱 새로 당장 지금 요즘 전혀 별로'.split(' '));   // 뒤쪽: 기록문 상투어·부사 (Code.gs 의 STOP 과 같아야 함, v3.10.3)\nvar KEEP = new Set(['경기도','품앗이','어린이','나들이','놀이터','민주주의','시군구','시군별','행복캠퍼스']);   // 조사처럼 끝나지만 그대로 둘 말 (경기도 → 경기 방지)\nvar VERB_JA = /^(만들|하|열|가|보|쓰|내|나|오|만나|해보|모이|나누|찾|알아보|배우|시작하)자$/;   // 청유형(…하자)\nvar JOSA = ['으로부터', '에서는', '에게서', '으로써', '이라도', '까지', '부터', '에서', '에게', '으로', '이나', '처럼', '보다', '마다', '조차', '마저', '은', '는', '이', '가', '을', '를', '의', '에', '도', '로', '과', '와', '랑', '만'];\nvar ENDINGS = ['싶습니다', '싶어요', '겠습니다', '했습니다', '습니다', '입니다', '합니다', '했으면', '있으면', '으면', '이에요', '에요', '어요', '아요', '해요', '거든요', '네요', '지요', '고요', '하고', '하는', '했던', '하며', '해서', '어서', '아서', '는지', '은지', '을지', '니다'];\n/* 화면용 단순 단어 빈도. 문장형 글에는 한계가 있어 분석 실행 전에는 핵심어를 화면에 내지 않는다(규칙 기반 묶음에만 사용) */\nfunction tokens(text) {\n  return String(text).replace(/[^\\p{L}\\p{N}\\s 그램과 상담 연계']],\n    6: [['첫 모임의 문턱은 정보가 아니라 나 같은 사람이 있을까 하는 마음이었다는 데 모두 동의했다. 신규 참가자에게 동행 회원 한 명을 붙여 주는 짝꿍 방식이 효과가 있었다는 경험이 나왔다. 모집 문구가 딱딱하면 아예 연락을 못 한다는 지적도 있었다.', '경기도 중장년 커뮤니티 지도와 첫 방문 체험권'],\n      ['아직 모임에 나가지 못하는 이유를 솔직하게 나눴다. 시간과 비용보다 내가 껴도 될까 하는 마음이 더 컸다는 말이 많았다. 첫날 프로그램을 통일해서 누구나 같은 출발선에 서게 하자는 제안이 나왔다.', '모집 문구를 경력 무관·첫 방문 환영으로 바꾸는 안내 지침']],\n    7: [['내일센터나 행복캠퍼스 상담을 받을 때 커뮤니티를 함께 소개받았으면 좋았겠다는 의견이 나왔다. 상담과 모임이 따로 돌아간다는 점이 아쉽다고 했다. 상담 창구에서 모임 체험을 바로 연결하는 절차가 필요하다는 데 뜻이 모였다.', '내일센터·행복캠퍼스 상담 시 커뮤니티를 함께 소개하는 연계 절차'],\n      ['온라인으로 먼저 얼굴을 익히고 나가면 부담이 줄었다는 경험이 공유됐다. 모임 전에 짧은 온라인 소개 시간을 두자는 제안이 있었다. 교통이 불편한 지역은 이동 지원이 있어야 참여가 가능하다는 이야기도 나왔다.', '외곽 지역 참가자를 위한 이동 지원과 온라인 사전 모임 도구']],\n    8: [['우리 모임 하나로는 작지만 31개 시군이 이으면 정책이 된다는 말에 공감이 모였다. 시군 커뮤니티 대표 연락망을 만들고 분기마다 온라인 교류회를 열자는 제안이 나왔다. 서로의 행사에 가 주는 것부터 시작하자는 구체적인 약속도 있었다.', '경기도 중장년 커뮤니티 네트워크 협의체 구성과 연 1회 포럼 정례화'],\n      ['경기도가 열어 줘야 할 문으로 공간 예약과 소액 활동비가 꼽혔다. 공동 프로젝트를 하려 해도 모일 장소가 없다는 현실이 반복됐다. 커뮤니티끼리 품앗이로 강사를 교환하자는 아이디어도 나왔다.', '커뮤니티 간 공동 프로젝트용 소액 활동비와 공간 예약 우선권']],\n    9: [['연결의 첫 행동은 거창한 사업이 아니라 서로의 행사에 가 주는 것이라는 데 모두 동의했다. 다음 달부터 이웃 커뮤니티 행사에 참여하고 결과를 나누기로 했다. 경기도 누리집에 커뮤니티 행사 달력이 있으면 좋겠다는 의견이 있었다.', '경기도 중장년 커뮤니티 행사 달력(온라인) 운영'],\n      ['시군 경계를 넘는 교류가 거의 없다는 점이 지적됐다. 고양과 파주처럼 가까운 시군부터 합동 행사를 열어 보자는 제안이 나왔다. 성과를 경기도에 보고하는 통로가 있으면 지속될 것이라는 이야기로 마무리했다.', '인접 시군 합동 행사 지원과 성과 보고 통로']]\n  };\n  var DEMO_LINES = [['다른 시 모임 대표 연락처 하나', 1], ['우리 모임이 뭘 더 할 수 있는지 힌트', 2], ['나만 힘든 게 아니라는 확인', 3], ['경기도가 실제로 뭘 해 줄 수 있는지', 4], ['돌봄 정보 어디서 찾는지', 5], ['다음에 같이 할 사람', 6],\n    ['평일 오전에 갈 곳', 7], ['용기', 8], ['같은 고민을 하는 사람들과의 만남', 9], ['우리 동네에서 시작할 수 있는 작은 일 하나', 1], ['퇴직 후 하루를 채우는 방법', 2], ['부모님 돌봄과 내 건강을 함께 챙기는 요령', 3],\n    ['모임을 꾸준히 이어 가는 노하우', 4], ['행복캠퍼스 프로그램 정보', 5], ['내 경험이 누군가에게 쓸모 있다는 느낌', 6], ['시군을 넘어 함께할 동료', 7], ['정책에 우리 목소리가 들어가는 통로', 8], ['새로 시작할 용기와 응원', 9],\n    ['첫 모임에 나갈 때 덜 떨리는 방법', 1], ['돌봄하는 사람끼리의 연락망', 2], ['혼자가 아니라는 마음', 3], ['우리 모임을 알릴 기회', 4], ['경기도 지원 사업 신청 방법', 5], ['오늘 만난 사람 한 명과 다음 약속', 6]];\n  (e) { return false; } }\nfunction setDone(v) { try { localStorage.setItem(DONE_KEY, v ? '1' : '0'); } catch (e) {} }\nfunction toast(msg, err) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); setTimeout(function () { t.className = 'toast'; }, 2200); }\nfunction render() {\n  var app = document.getElementById('app'); var my = mine(); var done = isDone();\n  var editing = editingId ? my.filter(function (o) { return o.id === editingId; })[0] : null;\n  app.innerHTML = '<section class=\"paper' + (editing ? ' editing' : '') + '\"><p class=\"prompt\">' + esc(PROMPT) + (editing ? '<small>· 고치는 중</small>' : '') + '</p>' +\n    '<textarea class=\"lines\" id=\"txt\" rows=\"5\" maxlength=\"500\" placeholder=\"자유롭게 적어 주세요. 길어도 괜찮아요.\">' + esc(draft) + '</textarea>' +\n    '<div class=\"pfoot\"><small></small><span style=\"flex:1\"></span>' + (editing ? '<button class=\"cancel\" id=\"cancelEdit\">취소</button>' : '') +\n    '<button class=\"send' + (editing ? ' edit' : '') + '\" id=\"send\" ' + (draft.trim() && !busy ? '' : 'disabled') + '>' + (busy ? '보내는 중…' : editing ? '수정 완료' : '스크린에 올리기') + '</button></div></section>' +\n    '<section class=\"mine\"><h4>내가 적은 것 <span style=\"font-weight:400\">· 이 기기에서만 보여요</span></h4>' +\n    (my.length ? my.slice().reverse().map(function (o) { return '<div class=\"note\"><div class=\"t\">' + esc(o.text) + '</div><div class=\"m\"><span>' + esc(o.at) + (o.edited ? ' · 고침 ' + o.edited + '회' : '') + '</span><span class=\"sp\"></span><button data-edit=\"' + o.id + '\">' + (editingId === o.id ? '고치는 중…' : '수정') + '</button></div></div>'; }).join('') : '<div class=\"empty\">아직 없어요. 위에 적고 올려 보세요.</div>') + '</section>' +\n    (my.length ? (done ? '<div class=\"donebox ok\"><b>작성 완료했습니다. 고맙습니다.</b><p style=\"margin:6px 0 0\">글을 고치면 완료가 풀리니, 고친 뒤에는 「작성 완료」를 다시 눌러 주세요.</p></div>'\n      : '<div class=\"donebox\"><p>다 적으셨으면 아래를 눌러 주세요. 완료한 분 수가 스크린에 표시됩니다. 완료 뒤에도 고칠 수 있어요.</p><button class  rev: 1, state: emptyState(), lines: [], records: emptyRecords(), program: mergeProgram(null), analysis: null }; }\n  function load() { try { var j = localStorage.getItem(KEY); if (j) { var d = JSON.parse(j); if (!d.records) d.records = emptyRecords(); if (!d.program) d.program = mergeProgram(null); return d; } } catch (e) {} var n = empty(); save(n); return n; }\n  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }\n  function bump(d) { d.rev = (d.rev || 0) + 1; save(d); }\n  function fail(msg) { return { ok: false, error: msg }; }\n  function isInt(n, lo, hi) { return typeof n === 'number' && isFinite(n) && Math.floor(n) === n && n >= lo && n <= hi; }\n  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }\n  /* ---- 규칙 기반 정리 (Code.gs 의 sentences_ · cut_ · tableRule_ 과 같은 규칙) ---- */\n  function sentences(s) { var m = String(s || '').replace(/\\r/g, '').match(/[^.!?\\n。]+[.!?。]?/g) || []; return m.map(function (x) { return x.trim(); }).filter(function (x) { return x.length >= 2; }); }\n  function cut(s, n) { s = String(s || '').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }\n  function recText(t) { var notes = [], wishes = []; [1, 2].forEach(function (r) { var x = rec(t, r); if (x.note.trim()) notes.push(x.note.trim()); if (x.wish.trim()) wishes.push(x.wish.trim()); }); return { note: notes.join('\\n'), wish: wishes.join(' / ') }; }\n  /* 규칙: one = 기록 첫 문장(≤70자), points = 그다음 문장 최대 6개(같은 문장은 한 번), wish = 바라는 것(≤80자) — Code.gs tableRule_ 와 같음 */\n  function tableRule(t) { var x = recText(t); var ss = sentences(x.note); var seen = {}; var rest = (ss.length > 1 ? ss.slice(1) : ss.slice(0, 1)).filter(function (p) { var k = p.replace(/\\s+/g, ''); if (seen[k]) return false; seen[k] = true; return true; }); return { t: t, one: cut(ss[0] || '', 70), points: rest.slice(0, 6).map(function (p) { return cut(p, 90); }), wish: cut(x.wish, 80), kw: tableKw([x.note, x.wish], 6) }; }\n  function analyze  참가자는 QR을 찍어 무기명으로 적습니다.</div><div class=\"url\" id=\"urlPhone\"></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card pub\"><span class=\"lbl\">참가자 쪽</span><h2>참가자 · 오늘의 한줄</h2><span class=\"who\">참가자 전원 · 본인 스마트폰 · 등록 12:00~12:30 · QR</span><p>나만의 노트처럼 보이는 페이지. 이름 없이 자유롭게 적고 \"스크린에 올리기\"를 누르면 바로 스크린에 뜹니다. 여러 번 적을 수 있습니다.</p><a id=\"lPhone\" target=\"_blank\">참가자 페이지 열기</a></div>\n    <div class=\"card pub\"><span class=\"lbl\">참가자 쪽</span><h2>스크린</h2><span class=\"who\">데미안홀 LED · 운영진 콘솔이 제어 · 조작 버튼 없음</span><p>등록 때는 QR과 실시간 한 줄 벽(최신 강조 + 1초 순환), 토론 때는 라운드 타이머와 테이블 배치, 결과공유에는 발표 슬라이드. F 키 전체화면.</p><a id=\"lScreen\" target=\"_blank\">스크린 열기</a></div>\n    <div class=\"card adm\"><span class=\"lbl\">운영진 쪽</span><h2>기록자</h2><span class=\"who\">테이블당 1명(9명) · 태블릿/노트북 · 13:40~15:00</span><p>토론 내용을 자유롭게 기록하면 분석 후 테이블 발표 슬라이드가 만들어집니다. 경기도·시군에 꼭 전하고 싶은 것은 따로 한 칸에 적습니다.</p><a id=\"lRec\" target=\"_blank\">기록자 페이지 열기</a></div>\n    <div class=\"card adm\"><span class=\"lbl\">운영진 쪽</span><h2>운영진 콘솔 (백단)</h2><span class=\"who\">운영진 1~2명 · 노트북 · PIN 필요</span><p>진행 단계·라운드 타이머·스크린 장표 제어, 프로그램(1부 내용)·참가자 명단, 오늘의 한줄 집계·숨김, 테이블 현황, 입력 마감 → 분석 실행, 결과 확인, PDF 보고서.</p><a id=\"lAdmin\" target=\"_blank\">운영진 콘솔 열기</a></div>\n    <div class=\"card adm\"><span class=\"lbl\">운영진 쪽</span><h2>테이블 QR 인쇄</h2><span class=\"who\">운영진 · 행사 전날 A4 세로 9장 인쇄 · 각 테이블에 비치</span><p>테이블 번호·주제·홀과 함께 그 테이블용 오늘의 한줄 QR이 한 장에 담깁니다. 참가자가 이 QR로 올린 글은 테이블 번호와 함께 모입니다.</p><a id=\"lPrint\" target=\"_blank\">인쇄 페이지 열기</a></div>\n  </div>\n  <div class=\"how\">\n    <h3>당일 순서</h3>\n    <ol>\n      <li><b>12:00</b> 운영진 콘솔에서 단계를 「등록」에 두고, 스크린을 LED에 전체화면(F)으로 띄웁니다. 테이블마다 인쇄한 QR을 두면 참가자가 QR로 한 줄씩 올립니다.</li>\n      <li><b>12:30</b> 「1부」로 넘기면 스크린이 1부 장표로 바뀝니다. 콘솔 「다음」으로 영상·인사말·발표자·기념촬영·좌석 안내 장을 차례로 넘깁니다(발표자 PPT로 전환해도 됩니다).</li>\n      <li><b>13:30</b> 「2부 발제」 → 2부 간지·토론 주제 4개 장을 「다음」으로 넘기며 주제를 안내합니다.</li>\n      <li><b>13:40</b> 「토론 1라운드」를 누르면 40분 타이머가 시작됩니다. 기록자 9명이 토론 내용을 기록합니다. <b>14:20</b> 「토론 2라운드」(참가자만 이동 var SIM_NOTES = {"1":["부모님 병원 동행과 손주 돌봄으로 3년을 보냈다는 이야기가 가장 많았다. 그동안 미뤄 둔 것은 운동과 친구였다고 했다. 이제 주 2회 걷기 모임에 나가기 시작했고, 아침 두 시간만이라도 내 시간을 확보하는 것이 첫 목표라고 했다. 돌봄 교대를 해 줄 사람과 동네 단위의 돌봄 품앗이 정보가 있으면 가능하겠다는 말이 나왔다.","2라운드에서는 간병 뒤 찾아온 공허감을 어떻게 넘겼는지 이야기가 이어졌다. 같은 처지의 사람을 만나 이야기한 것만으로 숨이 쉬어졌다는 분이 셋이었다. 시군 복지관의 가족 돌봄자 프로그램을 몰라서 못 썼다는 이야기가 공통이었다. 돌봄자 쉼 프로그램 정보를 한 곳에서 볼 수 있는 안내가 필요하다."],"2":["배우자 간병 중인 분과 치매 부모를 모시는 분이 돌봄의 무게를 나눴다. 내 건강검진을 2년이나 미뤘다는 말에 모두 고개를 끄덕였다. 시작하고 싶은 것은 요가와 글쓰기였다. 하루 한 시간을 만들려면 단기 돌봄 서비스가 있어야 한다는 결론이었다.","돌봄이 끝난 뒤의 삶을 미리 준비해야 한다는 이야기가 중심이었다. 돌봄 경험을 살려 돌봄 코디네이터 같은 일을 해 보고 싶다는 분이 둘이었다. 경기도 돌봄 관련 교육 과정과 연결되면 좋겠다고 했다."],"3":["자녀 교육이 끝나고 나니 내가 없더라는 말이 나왔다. 미뤄 둔 것은 여행과 공부였다. 방송통신대에 등록한 분, 캠핑 모임을 시작한 분의 사례가 자극이 됐다. 혼자 시작하기 어려우니 같이 등록할 동료가 필요하다는 이야기였다.","시간은 생겼는데 무엇부터 할지 모르겠다는 분들에게 먼저 시작한 분들이 요령을 나눴다. 작은 것부터, 돈 안 드는 것부터, 집 근처부터가 공통 조언이었다. 시군별 중장년 프로그램 안내가 흩어져 있어 찾기 어렵다고 했다."],"4":["퇴직 후 평일 오전 10시에 갈 곳이 없다는 것이 가장 큰 변화였다는 데 모두 공감했다. 동료와의 연락이 끊기고 가족과의 대화도 줄었다고 했다. 새로 만든 일과는 도서관 출근과 주 1회 등산이었다. 새 관계를 만드는 데 도움이 된 것은 동네 체육센터와 교회 모임이었고, 부족한 것은 또래 남성이 편하게 모일 공간이었다.","2라운드에서는 명함 없이 나를 소개하는 어색함이 화제였다. 직함 대신 관심사로 자기소개를 해 보자는 제안이 나왔다. 아침 루틴을 만든 분들의 공통점은 정해진 시간에 나가는 약속이 있다는 것이었다. 행복캠퍼스가 아침 시간대 프로그램을 늘려 주면 좋겠다는 바람이 있었다."],"5":["회사를 그만두니 전화가 오지 않더라는 이야기로 시작됐다. 관계를 새로 만드는 것보다 기존 관계를 다시 잇는 것이 쉬웠다는 사례가 있었다. 고향 친구 모임을 다시 열었고 한 달에 한 번 만난다고 했다. 새 일상을 만드는 데 필요한 것은 작은 역할이었다.","소속이 사라진 뒤 아내와의 관계가 더 중요해졌다는 분이 많았다. 부부가 같이 할 수 있는 프로그램이 있으면 좋겠다고 했다. 평일 낮에 갈 수 있는 동네 거점이 필요하다는 이야기가 공통이었다."],"6":["처음 모임에 나간 계기는 지인의 손에 이끌려서였다는 분이 대부분이었다. 혼자서는 문턱이 높았다고 했다. 나에게 맞았던 모임은 역할이 분명한 모임이었고, 맞지 않았던 모임은 말만 많은 모임이었다. 첫걸음에 필요한 것은 함께 갈 사람과 첫 회 무료 체험이었다.","모임을 망설이게 하는 것은 비용보다 분위기였다는 말이 많았다. 어떤 사람들이 오는지, 내가 끼어들 수 있는지를 미리 알 수 있으면 좋겠다고 했다. 모임 소개를 영상이나 사진으로 미리 보여 주는 플랫폼 아이디어가 나왔다."],"7":["책 읽는 모임에 나가 본 분이 모임의 핵심은 꾸준함이라고 했다. 맞지 않았던 모임은 리더 한 명이 다 하는 모임이었다. 첫걸음을 떼려면 정보가 한 곳에 모여 있어야 한다는 데 모두 동의했다. 시군 행복캠퍼스 홈페이지에 모임 목록이 있으면 좋겠다고 했다.","처음 온 사람을 환영하는 규칙이 있는 모임이 오래 간다는 이야기가 나왔다. 신입 환영 담당을 두자는 제안이 있었다. 교통이 불편한 지역은 온라인 모임을 섞으면 좋겠다는 의견이었다."],"8":["우리 모임이 지금 필요한 것은 장소와 홍보라는 데 의견이 모였다. 다른 모임과 연결되면 공동 행사를 열 수 있겠다고 했다. 첫 번째 공동 행동으로 시군 걷기 모임 연합 걷기 대회를 제안했다. 경기도가 열어 줘야 할 문은 공공 공간의 야간 개방이었다.","2라운드에서는 모임 간 연결을 누가 맡을지가 쟁점이었다. 행복캠퍼스가 허브 역할을 해 주면 좋겠다는 의견이 많았다. 연 1회 중장년 커뮤니티 박람회를 열자는 제안이 나왔다. 연합 활동에 쓸 소액 지원 사업이 있으면 좋겠다고 했다."],"9":["사진반과 글쓰기반이 만나 전시회를 열자는 이야기가 바로 나왔다. 다른 시의 비슷한 모임과 연락할 통로가 없다는 것이 문제였다. 경기도 차원의 커뮤니티 명부와 연락망이 있으면 첫 공동 행동이 가능하다고 했다.","연결이 되면 무엇을 할지보다 연결 자체가 먼저라는 말이 나왔다. 오늘 같은 포럼을 권역별로 자주 열어 달라는 요청이 많았다. 모임 대표들의 단체 대화방을 오늘 바로 만들자는 제안으로 마무리됐다."]};

    for (var s3 = 0; s3 < d3.length; s3++) { if (s3) await setState({ slide: s3 }); var ty = d3[s3].type; status('15:20 결과공유 — ' + (W().slideLabel ? W().slideLabel(d3[s3]) : ty) + ' (' + (s3 + 1) + '/' + d3.length + ')', 80 + 16 * s3 / d3.length); await wait(ty === 'oneline' ? 9000 : ty === 'end' ? 5000 : 7000); }

    await setState({ phase: 'close', slide: 0 }); status('15:50 마무리', 97); await wait(6000);
    await setState({ phase: 'end', slide: 0 }); status('16:00 폐회 — 시뮬레이션 끝. 「콘솔」 → 「보고서(PDF)」에서 결과를 볼 수 있습니다', 100); await wait(3000);
  } catch (e) { if (!/중지/.test(String(e && e.message))) throw e; status('중지됨 — 「▶ 전체 시뮬레이션」으로 처음부터 다시 볼 수 있습니다'); }
  finally { SIM.running = false; simBtn.disabled = false; simSkip.hidden = true; }
}
</script>
